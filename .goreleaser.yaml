# Tag-triggered release through truvity/ci-workflows release-public.yaml,
# which runs goreleaser and then, in the same job, pushes every chart
# named in the caller to ghcr.io/truvity/charts at the tag's version.
#
# One tag stamps everything: the charts, the Go module (a module needs no
# build step; the tag is its version), the cnpgctl binaries built here and
# the cnpgctl image. A person or a pipeline step runs the binary against a
# cluster they already have access to; the image exists for the one place
# cnpgctl runs inside the cluster, the cnpg-cluster chart's empty-bootstrap
# guard (a hook Job, guards.emptyBootstrap), whose tag defaults to the
# chart's appVersion, i.e. this same release.
version: 2

project_name: cnpg

builds:
  - id: cnpgctl
    main: ./cmd/cnpgctl
    binary: cnpgctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}}

# ghcr.io/truvity/cnpg/cnpgctl:<version> (bare: the image is that repository
# itself). release.yaml passes the same repository as ko-docker-repo, because
# the shared workflow's KO_DOCKER_REPO overrides `repositories` (its default,
# ghcr.io/truvity, would publish elsewhere). The base is pinned by digest;
# renovate moves it.
kos:
  - id: cnpgctl
    build: cnpgctl
    repositories:
      - ghcr.io/truvity/cnpg/cnpgctl
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    bare: true
    base_image: cgr.dev/chainguard/static:latest@sha256:41e17ed83c594a64a9396b6ab96dd26d5ddc290dacf4c177464712ff21ad534f
    sbom: none
    labels:
      org.opencontainers.image.title: cnpgctl
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/cnpg

archives:
  - id: cnpgctl
    ids: [cnpgctl]
    formats: [tar.gz]
    name_template: "cnpgctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github: {}
  header: |
    ## cnpg {{ .Tag }}

    Charts: `oci://ghcr.io/truvity/charts/cnpg-platform`, `cnpg-cluster`,
    `cnpg-project-platform`, `cnpg-backup-access`, `cnpg-database` and `cnpg-client` at `{{ .Version }}`. `barman-cloud-crds`
    (the barman-cloud plugin's CRDs, mirrored) is published at the upstream
    version it mirrors, once, by the `crd-charts` job.
    Go module: `go get github.com/truvity/cnpg/v2@{{ .Tag }}`.
    CLI: the `cnpgctl` archives below, or
    `go run github.com/truvity/cnpg/v2/cmd/cnpgctl@{{ .Tag }} --help`.
    Image: `ghcr.io/truvity/cnpg/cnpgctl:{{ .Version }}`.
