# Nothing here names an estate: every value is an input. With no clusters the
# chart renders nothing, but bucket.name, global.accountID,
# global.eksClusterName and global.rolePrefix are required as soon as one
# cluster is listed (see values.schema.json and templates/_validate.tpl).
global:
  # The SOURCE account: the account the Roles are created in and the
  # aws:SourceAccount the trust policy pins. Required.
  accountID: ""
  # The AWS partition in the bucket ARN.
  partition: aws
  # Required: the EKS cluster's region. Pins aws:SourceArn in the trust
  # policy and is set on each association as services.k8s.aws/region.
  region: ""
  # The EKS cluster the associations are made on. Required.
  eksClusterName: ""
  # Role names are <rolePrefix>-<cluster>-archive and -restore. Required.
  rolePrefix: ""
  # Optional: ARN of the managed policy set as the permissions boundary.
  permissionsBoundaryARN: ""
  # The namespace the ACK objects (Roles, associations) are created in; the
  # release namespace when empty. Put them where the ACK controllers' own
  # identity applies them, NOT in a project namespace: a project's identity
  # must not be able to mint these roles.
  objectNamespace: ""
  # false (default): the association's roleARN is computed from the partition,
  # account and role name (the estate pattern of cnpg-projects' backupAccess).
  # true: roleRef to the Role object, resolved by ACK once the Role is synced.
  useRoleRef: false
  # false (default): the PodIdentityAssociations carry NO adoption policy. A
  # Role is always adopt-or-create (its name is unique). true stamps
  # adopt-or-create on the associations too. Why it is off: with adoption a
  # new object adopts the existing association of the same (EKS cluster,
  # namespace, ServiceAccount); when the legacy object that also owns it is
  # pruned, its controller deletes the association in AWS, and the database is
  # left with none while the new object still reports Synced.
  adoptAssociations: false
  # Tags on every Role and association (the chart adds none).
  tags: {}

bucket:
  # The project's bucket in the backup account (a SingleProject bucket).
  name: ""

# One entry per CloudNativePG cluster; see the README for the fields.
clusters: []

commonLabels: {}
commonAnnotations: {}
