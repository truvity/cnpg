{{- $backup := include "cnpg-cluster.backup" . | fromJson }}
{{- if and $backup.enabled $backup.bucketName }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Values.clusterName }}-objectstore
  namespace: {{ .Values.namespace }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  configuration:
    destinationPath: s3://{{ $backup.bucketName }}/{{ include "cnpg-cluster.s3Prefix" . }}
{{- with $backup.endpoint }}
    endpointURL: {{ . | quote }}
{{- end }}
{{- with $backup.endpointCA }}
    endpointCA:
      name: {{ required "backup.endpointCA.name is required when endpointCA is set" .name }}
      key: {{ required "backup.endpointCA.key is required when endpointCA is set" .key }}
{{- end }}
{{- with $backup.tags }}
    # Object tags on every base backup and WAL upload (barman --tags); the
    # bucket lifecycle selects on them (docs/backupstore.md).
    tags:
      {{- toYaml . | nindent 6 }}
{{- end }}
{{- with $backup.historyTags }}
    # Object tags on the timeline history files only (barman --history-tags).
    historyTags:
      {{- toYaml . | nindent 6 }}
{{- end }}
    s3Credentials:
{{- if $backup.existingSecret }}
{{- $keys := $backup.existingSecretKeys | default dict }}
      accessKeyId:
        name: {{ $backup.existingSecret }}
        key: {{ $keys.accessKeyId | default "AWS_ACCESS_KEY_ID" }}
      secretAccessKey:
        name: {{ $backup.existingSecret }}
        key: {{ $keys.secretAccessKey | default "AWS_SECRET_ACCESS_KEY" }}
{{- with $keys.sessionToken }}
      sessionToken:
        name: {{ $backup.existingSecret }}
        key: {{ . }}
{{- end }}
{{- with $keys.region }}
      region:
        name: {{ $backup.existingSecret }}
        key: {{ . }}
{{- end }}
{{- else }}
      inheritFromIAMRole: true # the pod's ambient identity, bound by the platform
{{- end }}
    data:
      # Base backups: the CRD enum here is narrower than WAL's (no
      # zstd/xz — found by a server-side dry-run against the plugin).
      compression: {{ $backup.dataCompression }}
{{- with $backup.encryption }}
      encryption: {{ . }}
{{- end }}
      jobs: 2
    wal:
      compression: {{ $backup.walCompression }}
{{- with $backup.encryption }}
      encryption: {{ . }}
{{- end }}
      maxParallel: 4
{{- if $backup.retentionDays }}
  # The FUNCTIONAL PITR window; a bucket lifecycle rule, if any, is
  # the platform's backstop and must outlive it.
  retentionPolicy: {{ $backup.retentionDays }}d
{{- end }}
{{- end }}
