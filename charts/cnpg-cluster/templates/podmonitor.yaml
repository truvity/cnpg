{{- /* Optional PodMonitor for the instance pods' metrics exporter
(port `metrics`, 9187). Off by default: monitoring.coreos.com is not
installed everywhere, and a chart that rendered it unasked would fail
the install there. The operator's own spec.monitoring.enablePodMonitor is
deprecated upstream (see values.yaml), so the chart renders the object. */}}
{{- if .Values.monitoring.podMonitor.enabled }}
{{- $pm := .Values.monitoring.podMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.namespace }}
  {{- with (merge (dict) ($pm.labels | default dict) (.Values.labels | default dict)) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.clusterName }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      {{- with $pm.interval }}
      interval: {{ . | quote }}
      {{- end }}
      {{- with $pm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
