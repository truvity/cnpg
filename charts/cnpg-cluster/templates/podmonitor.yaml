{{- /* PodMonitor for the instance pods' metrics exporter (port `metrics`,
9187). On by default, but rendered only when the cluster serves the
monitoring.coreos.com/v1 PodMonitor API (prometheus-operator, or the
VictoriaMetrics operator with its converter): a cluster without the CRD
installs unchanged instead of failing. `helm template` has no cluster to ask,
so pass --api-versions monitoring.coreos.com/v1/PodMonitor to see the object.
The operator's own spec.monitoring.enablePodMonitor is deprecated upstream
(see values.yaml), so the chart renders the object.

Relabelings, in order: (1) the pg_settings drop (monitoring.podMonitor.
dropPgSettings), (2) the user's metricRelabelings. The Postgres cluster label
`cluster` is NOT added: the exporter already emits it on its own series
(cnpg_collector_up{cluster="<name>"}), and a target label of the same name
would push the exporter's value to exported_cluster. */}}
{{- if and .Values.monitoring.podMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
{{- $pm := .Values.monitoring.podMonitor }}
{{- $relabelings := list }}
{{- if $pm.dropPgSettings }}
{{- if $pm.keepPgSettings }}
{{- /* A relabel drop cannot say "all but these" in RE2, so mark the kept
settings first and drop the unmarked rest. */}}
{{- $names := list }}
{{- range $pm.keepPgSettings }}{{ $names = append $names (regexQuoteMeta .) }}{{ end }}
{{- $relabelings = append $relabelings (dict "action" "replace" "sourceLabels" (list "__name__" "name") "separator" ";" "regex" (printf "cnpg_pg_settings_setting;(%s)" (join "|" $names)) "targetLabel" "__tmp_keep_pg_setting" "replacement" "1") }}
{{- $relabelings = append $relabelings (dict "action" "drop" "sourceLabels" (list "__name__" "__tmp_keep_pg_setting") "separator" ";" "regex" "cnpg_pg_settings_.*;") }}
{{- /* Prometheus does not reliably strip __-prefixed labels after metric
relabeling, so remove the marker explicitly. */}}
{{- $relabelings = append $relabelings (dict "action" "labeldrop" "regex" "__tmp_keep_pg_setting") }}
{{- else }}
{{- $relabelings = append $relabelings (dict "action" "drop" "sourceLabels" (list "__name__") "regex" "cnpg_pg_settings_.*") }}
{{- end }}
{{- end }}
{{- $relabelings = concat $relabelings ($pm.metricRelabelings | default list) }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.namespace }}
  {{- with (merge (dict) ($pm.labels | default dict) (.Values.labels | default dict)) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.clusterName }}
      cnpg.io/podRole: instance
  {{- if not .Values.backup.expected }}
  {{- /* Copies the pod label cnpg-cluster/backup-expected onto every scraped
  series as cnpg_cluster_backup_expected (non-alphanumerics become `_`). */}}
  podTargetLabels:
    - cnpg-cluster/backup-expected
  {{- end }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      {{- with $pm.interval }}
      interval: {{ . | quote }}
      {{- end }}
      {{- with $relabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
