{{- $backup := include "cnpg-cluster.backup" . | fromJson }}
{{- if and $backup.enabled $backup.bucketName $backup.schedule }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.clusterName }}-scheduled-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ $backup.schedule | quote }}
  {{- if $backup.immediate }}
  immediate: true
  {{- end }}
  backupOwnerReference: self
  cluster:
    name: {{ .Values.clusterName }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: {{ .Values.clusterName }}-objectstore
{{- end }}
