{{- /* The stuck-reload guard (values guards.stuckReload, off by default): a
CronJob that runs `cnpgctl guard stuck-reload` (docs/cnpgctl.md) against this
one Cluster. It is an ordinary object of the release, not a hook. The exec
goes through the API server, so the pod needs egress to the API server only;
like the empty-bootstrap guard the chart renders no egress policy for it. */}}
{{- $v := (.Values.guards | default dict).stuckReload | default dict }}
{{- if $v.enabled }}
{{- $_ := include "cnpg-cluster.posture" . -}}
{{- $name := printf "%s-stuck-reload" .Values.clusterName | trunc 63 | trimSuffix "-" }}
{{- $img := $v.image | default dict }}
{{- $ref := printf "%s:%s" ($img.repository | default "ghcr.io/truvity/cnpg/cnpgctl") ($img.tag | default .Chart.AppVersion) }}
{{- with $img.digest }}{{ $ref = printf "%s@%s" $ref . }}{{ end }}
{{- $labels := dict "app.kubernetes.io/name" "cnpg-cluster-stuck-reload" "app.kubernetes.io/instance" .Values.clusterName "app.kubernetes.io/component" "stuck-reload" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
rules:
  # The one Cluster it watches.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    resourceNames: [{{ .Values.clusterName }}]
    verbs: [get]
  # The instance pods, found by label (list cannot be narrowed by name).
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  # pods/exec cannot be narrowed by label in RBAC, so this Role is
  # namespace-scoped: it can exec into any pod of the namespace. The binary
  # only ever execs the fixed `SELECT pg_reload_conf()` into this Cluster's
  # instance pods.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # The StuckReload Event on the Cluster (create cannot be narrowed by name).
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  schedule: {{ $v.schedule | default "*/3 * * * *" | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
    spec:
      # A failed run (exit 2: the API or an exec failed) is retried by the
      # next scheduled run, not by the Job.
      backoffLimit: 0
      activeDeadlineSeconds: {{ $v.activeDeadlineSeconds | default 120 | int }}
      template:
        metadata:
          labels:
            {{- toYaml $labels | nindent 12 }}
        spec:
          serviceAccountName: {{ $name }}
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: guard
              image: {{ $ref }}
              imagePullPolicy: {{ $img.pullPolicy | default "IfNotPresent" }}
              args:
                - guard
                - stuck-reload
                - --namespace={{ .Values.namespace }}
                - --cluster={{ .Values.clusterName }}
                - --stuck-for={{ $v.stuckFor | default "5m" }}
                {{- range $v.phases | default (list "Waiting for the instances to become active" "Switchover in progress" "Cluster cannot proceed to reconciliation due to an error while interacting with plugins") }}
                - {{ printf "--phases=%s" . | quote }}
                {{- end }}
              terminationMessagePolicy: FallbackToLogsOnError
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                {{- $v.resources | default (dict "requests" (dict "cpu" "10m" "memory" "32Mi") "limits" (dict "memory" "64Mi")) | toYaml | nindent 16 }}
{{- end }}
