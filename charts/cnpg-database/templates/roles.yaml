{{- /* DatabaseRole per roles[] entry, and a cert-manager Certificate per
role that asks for a client certificate (Secret <cluster>-role-<role>,
commonName = the role name). Underscores in the Secret and object names
become "-": Kubernetes names may not carry them.

A role with generatedPassword also renders an External Secrets Password
generator and a once-only ExternalSecret that fill the basic-auth Secret
the DatabaseRole reads its passwordSecret from (see docs/reference.md).
That path alone needs the External Secrets CRDs; a chart without
generatedPassword renders none of it. The Password and ExternalSecret carry
generatedPassword.labels when set, else the role's labels.

databaseRole: false renders the Password and ExternalSecret only, for a
consumer whose own Cluster declares the managed role (the guard makes it
require generatedPassword). */}}
{{- range .Values.roles }}
{{- $role := . }}
{{- $slug := .name | replace "_" "-" }}
{{- $cc := .clientCertificate | default dict }}
{{- $gp := .generatedPassword | default dict }}
{{- $genLabels := $gp.labels | default $role.labels }}
{{- if or (not (hasKey . "databaseRole")) .databaseRole }}
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ .objectName | default (printf "%s-role-%s" $.Values.clusterName $slug) }}
  namespace: {{ include "cnpg-database.namespace" $ }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  cluster:
    name: {{ $.Values.clusterName }}
  name: {{ .name }}
  ensure: {{ .ensure | default "present" }}
  login: {{ if hasKey . "login" }}{{ .login }}{{ else }}true{{ end }}
  {{- if hasKey . "inherit" }}
  inherit: {{ .inherit }}
  {{- end }}
  {{- with .inRoles }}
  inRoles:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if hasKey . "connectionLimit" }}
  connectionLimit: {{ .connectionLimit }}
  {{- end }}
  {{- with (.passwordSecret | default $gp.secretName) }}
  passwordSecret:
    name: {{ . }}
  {{- end }}
  {{- if hasKey . "disablePassword" }}
  disablePassword: {{ .disablePassword }}
  {{- end }}
  {{- with .validUntil }}
  validUntil: {{ . | quote }}
  {{- end }}
  {{- with .comment }}
  comment: {{ . | quote }}
  {{- end }}
  {{- with .databaseRoleReclaimPolicy }}
  databaseRoleReclaimPolicy: {{ . }}
  {{- end }}
{{- end }}
{{- if $gp.secretName }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $gp.secretName }}
  namespace: {{ include "cnpg-database.namespace" $ }}
  {{- with $genLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  length: {{ $gp.length | default 32 }}
  digits: {{ if hasKey $gp "digits" }}{{ $gp.digits }}{{ else }}5{{ end }}
  symbols: {{ if hasKey $gp "symbols" }}{{ $gp.symbols }}{{ else }}0{{ end }}
  noUpper: {{ if hasKey $gp "noUpper" }}{{ $gp.noUpper }}{{ else }}false{{ end }}
  allowRepeat: {{ if hasKey $gp "allowRepeat" }}{{ $gp.allowRepeat }}{{ else }}true{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $gp.secretName }}
  namespace: {{ include "cnpg-database.namespace" $ }}
  {{- with $genLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Generated once and never refreshed: a refresh would mint a new password
  # and lock out every pod holding the old one.
  refreshInterval: "0"
  target:
    name: {{ $gp.secretName }}
    template:
      # basic-auth is what the operator reads a managed role's credential from.
      type: kubernetes.io/basic-auth
      data:
        username: {{ .name | quote }}
        password: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $gp.secretName }}
{{- end }}
{{- if $cc.enabled }}
{{- $issuer := $cc.issuerRef | default $.Values.clientCertificateIssuerRef | default dict }}
{{- $algo := $cc.algorithm | default $.Values.clientCertificate.algorithm }}
{{- $size := $cc.size | default $.Values.clientCertificate.size | default (ternary 256 2048 (eq $algo "ECDSA")) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.clusterName }}-role-{{ $slug }}
  namespace: {{ include "cnpg-database.namespace" $ }}
spec:
  secretName: {{ $.Values.clusterName }}-role-{{ $slug }}
  commonName: {{ .name }}
  usages:
    - client auth
  privateKey:
    algorithm: {{ $algo }}
    size: {{ $size | int }}
    rotationPolicy: Always
  {{- with ($cc.duration | default $.Values.clientCertificate.duration) }}
  duration: {{ . }}
  {{- end }}
  {{- with ($cc.renewBefore | default $.Values.clientCertificate.renewBefore) }}
  renewBefore: {{ . }}
  {{- end }}
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  {{- if ($cc.additionalOutputFormats | default $.Values.clientCertificate.additionalOutputFormats) }}
  additionalOutputFormats:
    {{- range ($cc.additionalOutputFormats | default $.Values.clientCertificate.additionalOutputFormats) }}
    - type: {{ . }}
    {{- end }}
  {{- end }}
  issuerRef:
    name: {{ $issuer.name | default (include "cnpg-database.defaultIssuer" $) }}
    kind: {{ $issuer.kind | default "ClusterIssuer" }}
    group: {{ $issuer.group | default "cert-manager.io" }}
{{- end }}
{{- end }}
