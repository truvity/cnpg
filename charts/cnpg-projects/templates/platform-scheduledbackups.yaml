{{- /* One ScheduledBackup per entry: method plugin (barman-cloud), owned by
itself, writing to the ObjectStore the entry names. `immediate` defaults to
true (first base backup on creation; the operator ignores it once the
ScheduledBackup has run); `immediate: false` on an entry leaves it out.
`name` defaults to <clusterName>-scheduled-backup and `objectStoreName` to
<clusterName>-objectstore, the name the cnpg-cluster chart gives its store.
argocd.scheduledBackupSyncWave is the sync-wave annotation, under the
entry's own. */}}
{{- $seen := dict }}
{{- range $i, $b := .Values.scheduledBackups }}
{{- if include "cnpg-projects.platform.on" $b }}
{{- $cluster := required (printf "scheduledBackups[%d].clusterName is required" $i) $b.clusterName }}
{{- $name := $b.name | default (printf "%s-scheduled-backup" $cluster) }}
{{- $ns := required (printf "scheduledBackups[%d].namespace is required" $i) $b.namespace }}
{{- $key := printf "%s/%s" $ns $name }}
{{- if hasKey $seen $key }}
{{- fail (printf "scheduledBackups: %q appears twice" $key) }}
{{- end }}
{{- $_ := set $seen $key true }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  {{- include "cnpg-projects.platform.metadata" (dict "root" $ "name" $name "namespace" $ns "labels" $b.labels "annotations" (merge (dict) ($b.annotations | default dict) (include "cnpg-projects.platform.waveAnnotations" (dict "wave" ($.Values.argocd.scheduledBackupSyncWave | toString)) | fromYaml))) | nindent 2 }}
spec:
  schedule: {{ $b.schedule | default "0 0 2 * * *" | quote }}
  {{- if or (not (hasKey $b "immediate")) $b.immediate }}
  immediate: true
  {{- end }}
  backupOwnerReference: self
  method: plugin
  cluster:
    name: {{ $cluster }}
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: {{ $b.objectStoreName | default (printf "%s-objectstore" $cluster) }}
{{- end }}
{{- end }}
