apiVersion: v2
name: cnpg-projects
description: >-
  Every project's database on one Kubernetes cluster, from a list of rows: a
  cnpg-cluster per row, the ScheduledBackup and server TLS objects the
  platform owns beside it, and the IAM role that lets the cluster archive to
  its backup bucket, with the Pod Identity associations of its
  ServiceAccounts. The chart decides nothing about which project gets what.
type: application
