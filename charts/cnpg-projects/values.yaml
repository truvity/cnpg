# cnpg-projects: the databases of every project on one Kubernetes cluster.
# Everything is a list and every list is empty until asked for. The caller
# decides which project gets which object; no name below is a default.

# Stamped on every platform object (ScheduledBackup, server TLS).
commonLabels: {}
commonAnnotations: {}

# One cnpg-cluster per entry. `values` is that chart's values (charts/
# cnpg-cluster/values.yaml lists them; its defaults are merged under yours).
# `clusterName` and `namespace` are required there as in cnpg-cluster.
clusters: []
#  - values:
#      clusterName: example-pg
#      namespace: example
#      profile: prod
#      annotations: {}      # on the Cluster and its ObjectStore
#    # Optional, per row: prove the cluster's ServiceAccount gets its Pod
#    # Identity before the release is applied (see "identityCheck" below).
#    identityCheck:
#      enabled: true
#      expectRole: example-pg-archive   # required when enabled: the role NAME
#      serviceAccount: example-pg       # default: values.clusterName
#      expectAccount: "<account-id>"    # optional, 12 digits, see the note below

# The identity check, per clusters[] entry (`identityCheck`, a sibling of
# `values`). Off by default. When `enabled`, a pre-install/pre-upgrade hook Job
# (truvity/policy service-lib `identityCheck`) runs in the entry's namespace as
# the entry's ServiceAccount and fails unless the pod it runs in was admitted
# with the cloud identity of `expectRole`. Credentials are injected only when a
# pod is admitted and a Pod Identity association is "Synced" seconds before the
# admission webhook sees it, so a database pod created in that gap archives
# nothing for its whole life. The ServiceAccount is the CNPG operator's (it
# creates and owns the one named like the Cluster): this chart renders none, so
# turn the check on only once the Cluster exists. The namespace must let the
# check pod reach the cloud API (egress); that policy is not rendered here.
#   expectAccount: optional 12-digit AWS account the pod must run in; forwarded
#   to service-lib, which passes `-expect-account` to the check (it needs
#   images.identity-check from truvity/k8s v0.34.0 or later, pinned below).

# The check's image (service-lib reads images.identity-check). A digest pin:
# truvity/k8s identity-check 0.34.0.
images:
  identity-check:
    registry: ghcr.io
    repository: truvity/k8s/identity-check
    tag: 0.34.0
    digest: sha256:9fc40a066f5455eb807f0826f7083b0ead46924956af3c8ed5e2c381233d1a38

# The cnpg-project-platform inputs, unchanged: ScheduledBackups and server
# TLS for the clusters above (Rule Z: the cnpg-cluster chart renders the
# ObjectStore, these objects point at it).
scheduledBackups: []
serverTLS: []
# Merged under every serverTLS entry, the entry winning: what is the same for
# every Cluster of a platform (issuerRef, caCertificates, duration,
# renewBefore, privateKey, labels).
serverTLSDefaults: {}
# A scheduledBackups entry names its ScheduledBackup {clusterName}-scheduled-backup
# and its ObjectStore {clusterName}-objectstore unless it says otherwise. Argo CD
# hints on those objects (annotations; an entry's own win). Set a wave to "" (or
# guardCASecret to false) to render none.
argocd:
  # sync-wave of every ScheduledBackup: after the Cluster and its ObjectStore.
  scheduledBackupSyncWave: "25"
  # sync-wave of the server Certificate and CA Secret: BEFORE the Cluster (wave
  # 0) that names them. The Cluster cannot become healthy without the CA Secret
  # and Argo CD starts no later wave until the earlier is healthy.
  serverTLSSyncWave: "-1"
  # Prune=false,Delete=false on the CA Secret alone: removing an entry never
  # drops the CA the running database verifies with.
  guardCASecret: true

# The archive identity: an IAM role per project, with the same trust and the
# same permissions each time, and a Pod Identity association per
# ServiceAccount. Rendered when `roles` is not empty (the ACK objects live in
# `objectNamespace`: where the controller's own identity applies, not in the
# project's namespace).
backupAccess:
  clusterName: ""        # the Kubernetes cluster (EKS) the roles trust
  accountID: ""
  region: ""
  bucketName: ""         # the backup bucket
  kmsKeyArn: ""          # the bucket's key
  permissionsBoundary: ""  # policy ARN, optional
  objectNamespace: ""    # required when roles is not empty
  annotations: {}        # on every ACK object
  roles: []
#  - name: example-pg-backup-example     the IAM role's name
#    project: example                    the S3 key prefix owner: {project}/
#    namespace: example                  where the ServiceAccounts live
#    primaryCluster: example-pg          the Cluster CR: writes {project}/{cluster}/
#    serviceAccounts: [example-pg, example-rehearsal-pg]   primary first
