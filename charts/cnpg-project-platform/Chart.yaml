apiVersion: v2
name: cnpg-project-platform
description: >-
  The per-project objects a platform owns beside a CloudNativePG Cluster it
  does not render itself: the barman-cloud ObjectStore, the ScheduledBackup
  that takes base backups into it, and the server certificate with its CA
  Secret. Every name, namespace and address is an input; the chart decides
  nothing about which project gets what.
type: application
