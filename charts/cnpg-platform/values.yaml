# cnpg-platform: the platform-owned objects that sit beside the upstream
# `cloudnative-pg` and `plugin-barman-cloud` charts. Install it ONCE per
# Kubernetes cluster. Everything is off until asked for, and nothing here
# names an estate: class names, provisioners, namespaces and selectors are
# inputs. See docs/reference.md and examples/operator/.

# Labels and annotations stamped on every object this chart renders.
commonLabels: {}
commonAnnotations: {}

# StorageClasses for PostgreSQL volumes. Each entry needs a name and a
# provisioner; the defaults below are the posture a database wants
# (expandable, bound where the pod is scheduled).
storageClasses:
  enabled: false
  # - name: example-retain            required
  #   provisioner: example.csi/driver required
  #   parameters: {type: gp3, encrypted: "true"}
  #   reclaimPolicy: Retain           Retain | Delete (default Retain)
  #   volumeBindingMode: WaitForFirstConsumer | Immediate (default WaitForFirstConsumer)
  #   allowVolumeExpansion: true
  #   isDefault: false
  #   mountOptions: []
  #   labels: {}
  #   annotations: {}
  classes: []

# A NetworkPolicy that opens the instance pods' metrics port to a scraper.
# Rendered once into each namespace listed, selecting only pods that carry
# the cnpg.io/cluster label (database instances). Network policies are
# additive: this unions with whatever baseline policy the namespace has.
metricsNetworkPolicy:
  enabled: false
  name: cnpg-instance-metrics
  port: 9187
  # Namespaces that host PostgreSQL clusters. Required when enabled. Each
  # entry is a namespace name, or an object {name, labels, annotations} when
  # one namespace's policy needs metadata the others do not carry (merged
  # over the labels and annotations above).
  namespaces: []
  #  - example-one
  #  - name: example-two
  #    labels: {example.com/tier: primary}
  #    annotations: {argocd.argoproj.io/sync-options: Prune=false}
  # NetworkPolicyPeer objects allowed to scrape (namespaceSelector and/or
  # podSelector). Required when enabled: there is no default scraper.
  from: []
  labels: {}
  annotations: {}

# ONE PodMonitor that scrapes the exporter (port `metrics`, 9187) of every
# CloudNativePG instance pod the scraper can see, selected by the label the
# operator puts on instance pods and only there (cnpg.io/podRole=instance).
# Needs the monitoring.coreos.com/v1 PodMonitor API (prometheus-operator, or
# the VictoriaMetrics operator's converter); the chart does not probe for
# it, so enable it only where it is served. A database that renders its own
# PodMonitor (cnpg-cluster does, by default) is scraped twice beside this
# one: turn the cluster's off (monitoring.podMonitor.enabled=false), or
# leave this off. The scrape job is <namespace>/<name>.
podMonitor:
  enabled: false
  name: cnpg-instances
  # Namespace of the PodMonitor itself. Empty = the release namespace.
  namespace: ""
  # Namespaces whose instance pods are scraped. Empty = every namespace.
  namespaces: []
  # e.g. "30s". Empty = the scraper's own default.
  interval: ""
  # Pod labels copied onto every scraped series (the operator turns each
  # non-alphanumeric character of the key into `_`), e.g.
  # cnpg-cluster/backup-expected, which the cnpg-cluster chart sets on a
  # database that is deliberately not backed up.
  podTargetLabels: []
  # Drop the cnpg_pg_settings_* family before it is stored (roughly 500-700
  # series per instance), except the settings in keepPgSettings: the ones
  # the upstream CloudNativePG Grafana dashboard reads. Same behaviour and
  # same relabeling as cnpg-cluster's monitoring.podMonitor.
  dropPgSettings: true
  keepPgSettings:
    - block_size
    - effective_cache_size
    - maintenance_work_mem
    - max_connections
    - random_page_cost
    - seq_page_cost
    - shared_buffers
    - work_mem
  # Appended after the drop above. Write `action` explicitly on every rule:
  # only the prometheus-operator CRD defaults it.
  metricRelabelings: []
  labels: {}
  annotations: {}

# Baseline alert rules over the metrics CloudNativePG, cert-manager and the
# kubelet already export. Render as a PrometheusRule or a VMRule.
alerts:
  enabled: false
  # PrometheusRule | VMRule
  kind: PrometheusRule
  name: cnpg-baseline
  # Labels the rule selector of your Prometheus / VMAgent needs.
  labels: {}
  annotations: {}
  # Labels added to every rule (routing keys for the alert router).
  ruleLabels: {}
  # Added to every expression's label matchers, e.g. `namespace=~"pg-.*"`.
  # Empty matches every cluster the scraper sees.
  selector: ""
  severity:
    warning: warning
    critical: critical
  archiving:
    enabled: true
    # Archiving has failed more recently than it last succeeded, for this long.
    for: 15m
  backupAge:
    enabled: true
    # Needs the barman-cloud plugin (plugin-barman-cloud >= v0.13.0), whose
    # sidecar exports barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
    # (internal/cnpgi/instance/metrics.go). Set false for clusters that back
    # up another way: no metric means no alert, but also no coverage.
    # Seconds since the newest successful backup (default 2 days); a cluster
    # with no backup at all (value 0) fires too.
    maxAgeSeconds: 172800
    for: 30m
  replicationLag:
    enabled: true
    maxLagSeconds: 300
    for: 10m
  # Guards against silent absence: the rules above read cnpg_* series, and
  # an instance whose exporter or scrape is down simply stops producing
  # them, which looks healthy.
  exporterDown:
    enabled: true
    # cnpg_collector_up == 0: the exporter runs but cannot reach PostgreSQL.
    for: 5m
  scrapeDown:
    enabled: true
    # up == 0 on the `postgres` container of a PodMonitor target (needs the
    # cnpg-cluster chart's PodMonitor or an equivalent). Absent targets
    # (no PodMonitor, scrape dropped) cannot fire an `up == 0` rule.
    # RE2 over the scrape job; a PodMonitor's job is <namespace>/<name>.
    jobRegex: ".+/.+"
    for: 10m
  backupNotConfigured:
    enabled: true
    # An instance that exports cnpg_collector_up but no barman-cloud backup
    # series has no backups configured (CnpgBackupTooOld cannot see it).
    # A cluster that is deliberately not backed up opts out with
    # backup.expected=false (plus a reason) in the cnpg-cluster chart; its
    # PodMonitor then labels the series cnpg_cluster_backup_expected="false".
    # Needs that PodMonitor (or the same label) to be able to opt out.
    for: 1h
  certExpiry:
    # Needs cert-manager metrics. Off until a matcher says which
    # Certificates are the database's.
    enabled: false
    # RE2 regexp over the Certificate `name` label, e.g. "pg-.*". Required
    # when enabled.
    nameRegex: ""
    warnDays: 14
    criticalDays: 3
    for: 10m
  walDisk:
    enabled: true
    # RE2 regexp over the PVC name of the WAL volume (CloudNativePG names
    # it <instance>-wal).
    pvcRegex: ".*-wal"
    # Free fraction below which to alert.
    minFreeFraction: 0.15
    for: 10m

# A ValidatingAdmissionPolicy that refuses a DatabaseRole with superuser,
# replication, bypassrls or createrole. A database role a product declares
# is product-owned; these four attributes are the platform's.
admission:
  databaseRoleGuard:
    enabled: false
    name: cnpg-database-role-guard
    # Namespaces the guard covers: a standard label selector. Required
    # when enabled (an empty selector would cover every namespace,
    # including the platform's own).
    namespaceSelector: {}
    # Deny | Warn | Audit
    validationActions: [Deny]
    # Fail | Ignore
    failurePolicy: Fail
    # Attributes refused. Subset of the four.
    forbid: [superuser, replication, bypassrls, createrole]
