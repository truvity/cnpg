{{- /* Baseline alert rules. Each rule is an expression over a metric the
CloudNativePG instance exporter, cert-manager or the kubelet already
publishes; thresholds are inputs. */}}
{{- $a := .Values.alerts }}
{{- if $a.enabled }}
{{- $sel := $a.selector }}
{{- $selC := ternary (printf ", %s" $sel) "" (ne $sel "") }}
{{- if and $a.certExpiry.enabled (not $a.certExpiry.nameRegex) }}
{{- fail "alerts.certExpiry.enabled is true but alerts.certExpiry.nameRegex is empty: say which Certificates are the database's" }}
{{- end }}
{{- if and $a.certExpiry.enabled (le (int $a.certExpiry.warnDays) (int $a.certExpiry.criticalDays)) }}
{{- fail "alerts.certExpiry.warnDays must be greater than criticalDays: the warning has to come first" }}
{{- end }}
{{- $rules := list }}
{{- if $a.archiving.enabled }}
{{- $rules = append $rules (dict
  "alert" "CnpgWalArchivingFailing"
  "expr" (printf "cnpg_pg_stat_archiver_last_failed_time{%s} > cnpg_pg_stat_archiver_last_archived_time{%s}" (trimPrefix ", " $selC) (trimPrefix ", " $selC))
  "for" $a.archiving.for
  "severity" $a.severity.critical
  "summary" "WAL archiving is failing on {{ $labels.pod }}"
  "description" "The last failed WAL archive is newer than the last successful one. Point-in-time recovery is degrading and WAL is accumulating on the volume.") }}
{{- end }}
{{- if $a.backupAge.enabled }}
{{- /* The barman-cloud plugin's sidecar metric, relayed verbatim on each
instance's metrics endpoint: plugin-barman-cloud v0.13.0 (chart 0.7.0),
internal/cnpgi/instance/metrics.go lines 37-52 (name), 123 and 150 (value:
ObjectStore status.serverRecoveryWindow[server].lastSuccessfulBackupTime, 0
when there is none). cnpg_collector_last_available_backup_timestamp is
deprecated since CloudNativePG 1.26 and stays 0 under the plugin. */}}
{{- $rules = append $rules (dict
  "alert" "CnpgBackupTooOld"
  "expr" (printf "time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{%s} > %d" (trimPrefix ", " $selC) (int $a.backupAge.maxAgeSeconds))
  "for" $a.backupAge.for
  "severity" $a.severity.warning
  "summary" "No recent backup for {{ $labels.pod }}"
  "description" (printf "The newest successful backup recorded by the barman-cloud plugin is older than %d seconds, or there is none." (int $a.backupAge.maxAgeSeconds))) }}
{{- end }}
{{- if $a.replicationLag.enabled }}
{{- $rules = append $rules (dict
  "alert" "CnpgReplicationLagHigh"
  "expr" (printf "cnpg_pg_replication_lag{%s} > %d" (trimPrefix ", " $selC) (int $a.replicationLag.maxLagSeconds))
  "for" $a.replicationLag.for
  "severity" $a.severity.warning
  "summary" "Replica {{ $labels.pod }} is lagging"
  "description" (printf "Replication lag has exceeded %d seconds." (int $a.replicationLag.maxLagSeconds))) }}
{{- end }}
{{- if $a.certExpiry.enabled }}
{{- $m := printf "name=~\"%s\"%s" $a.certExpiry.nameRegex $selC }}
{{- $rules = append $rules (dict
  "alert" "CnpgCertificateExpiring"
  "expr" (printf "certmanager_certificate_expiration_timestamp_seconds{%s} - time() < %d * 86400" $m (int $a.certExpiry.warnDays))
  "for" $a.certExpiry.for
  "severity" $a.severity.warning
  "summary" "Certificate {{ $labels.name }} expires soon"
  "description" (printf "Fewer than %d days remain. A renewal that has not happened by now is stuck." (int $a.certExpiry.warnDays))) }}
{{- $rules = append $rules (dict
  "alert" "CnpgCertificateExpiryImminent"
  "expr" (printf "certmanager_certificate_expiration_timestamp_seconds{%s} - time() < %d * 86400" $m (int $a.certExpiry.criticalDays))
  "for" $a.certExpiry.for
  "severity" $a.severity.critical
  "summary" "Certificate {{ $labels.name }} is about to expire"
  "description" (printf "Fewer than %d days remain." (int $a.certExpiry.criticalDays))) }}
{{- end }}
{{- if $a.walDisk.enabled }}
{{- $m := printf "persistentvolumeclaim=~\"%s\"%s" $a.walDisk.pvcRegex $selC }}
{{- $rules = append $rules (dict
  "alert" "CnpgWalVolumeFillingUp"
  "expr" (printf "kubelet_volume_stats_available_bytes{%s} / kubelet_volume_stats_capacity_bytes{%s} < %v" $m $m $a.walDisk.minFreeFraction)
  "for" $a.walDisk.for
  "severity" $a.severity.critical
  "summary" "WAL volume {{ $labels.persistentvolumeclaim }} is nearly full"
  "description" (printf "Less than %v of the volume is free. A full WAL volume stops the instance." $a.walDisk.minFreeFraction)) }}
{{- end }}
{{- /* Guards against silent absence. Every rule above reads cnpg_* series
the instance exporter serves; when the exporter, its database connection or
the scrape itself is down those series go stale or vanish and the rules read
healthy. Names and shapes follow the upstream cluster chart's
CNPGClusterOffline and CNPGInstanceMetricsAbsent rules
(cloudnative-pg/charts, charts/cluster/prometheus_rules). */}}
{{- if $a.exporterDown.enabled }}
{{- $rules = append $rules (dict
  "alert" "CnpgInstanceExporterDown"
  "expr" (printf "cnpg_collector_up{%s} == 0" (trimPrefix ", " $selC))
  "for" $a.exporterDown.for
  "severity" $a.severity.critical
  "summary" "The metrics exporter on {{ $labels.pod }} cannot reach PostgreSQL"
  "description" "cnpg_collector_up is 0: the instance's exporter is up but its database connection is not, so the cnpg_pg_* series the other rules read are missing or stale.") }}
{{- end }}
{{- if $a.scrapeDown.enabled }}
{{- /* A PodMonitor target is the instance pod's `postgres` container and its
job is <namespace>/<PodMonitor name> (the cnpg-cluster chart names the
PodMonitor after the cluster); alerts.selector narrows it further. */}}
{{- $rules = append $rules (dict
  "alert" "CnpgInstanceScrapeDown"
  "expr" (printf "up{container=\"postgres\",job=~\"%s\"%s} == 0" $a.scrapeDown.jobRegex $selC)
  "for" $a.scrapeDown.for
  "severity" $a.severity.critical
  "summary" "The metrics of {{ $labels.pod }} are not being scraped"
  "description" "The scrape target of a CloudNativePG instance has been down: its exporter is hung or unreachable (a network policy, a TLS mismatch), so the lag, archiving and HA rules cannot see the instance.") }}
{{- end }}
{{- if $a.backupNotConfigured.enabled }}
{{- /* An instance that serves no barman-cloud backup series at all has no
backup configured, which CnpgBackupTooOld cannot see (no series, no alert).
Both series come from the same scrape target, so they join on (namespace,
pod). A cluster that is deliberately not backed up says so with
backup.expected=false in the cnpg-cluster chart: its PodMonitor then adds the
target label cnpg_cluster_backup_expected="false" (pod label
cnpg-cluster/backup-expected). */}}
{{- $rules = append $rules (dict
  "alert" "CnpgBackupNotConfigured"
  "expr" (printf "cnpg_collector_up{%s%scnpg_cluster_backup_expected!=\"false\"} unless on (namespace, pod) barman_cloud_cloudnative_pg_io_last_available_backup_timestamp" (trimPrefix ", " $selC) (ternary ", " "" (ne $sel "")))
  "for" $a.backupNotConfigured.for
  "severity" $a.severity.warning
  "summary" "No backup is configured for {{ $labels.pod }}"
  "description" "The instance exports no barman-cloud backup metric, so CnpgBackupTooOld cannot see it: backups are not configured. Configure them, or, if this cluster is deliberately not backed up, opt out in the cnpg-cluster chart with backup.expected=false and a backup.notExpectedReason.") }}
{{- end }}
{{- if not $rules }}
{{- fail "alerts.enabled is true but every rule is off: nothing to render" }}
{{- end }}
---
{{- if eq $a.kind "VMRule" }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
{{- else }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
{{- end }}
metadata:
  name: {{ $a.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-platform.labels" . | nindent 4 }}
    {{- with $a.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "cnpg-platform.annotations" (dict "root" . "own" $a.annotations)) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  groups:
    - name: {{ $a.name }}
      rules:
        {{- range $r := $rules }}
        - alert: {{ $r.alert }}
          expr: {{ $r.expr | quote }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            {{- with $.Values.alerts.ruleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: {{ $r.summary | quote }}
            description: {{ $r.description | quote }}
        {{- end }}
{{- end }}
