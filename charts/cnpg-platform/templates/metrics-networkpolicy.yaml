{{- /* Opens the instance metrics port to a scraper, in each namespace that
hosts PostgreSQL. Selects only pods labelled cnpg.io/cluster, so the door
opens on database instances and nothing else in the namespace. */}}
{{- $np := .Values.metricsNetworkPolicy }}
{{- if $np.enabled }}
{{- if not $np.namespaces }}
{{- fail "metricsNetworkPolicy.enabled is true but metricsNetworkPolicy.namespaces is empty: name the namespaces that host PostgreSQL" }}
{{- end }}
{{- if not $np.from }}
{{- fail "metricsNetworkPolicy.enabled is true but metricsNetworkPolicy.from is empty: there is no default scraper, name one" }}
{{- end }}
{{- $seenNs := dict }}
{{- range $entry := $np.namespaces }}
{{- /* An entry is a namespace name, or {name, labels, annotations}: the
object form carries metadata only that namespace's policy needs, merged over
the policy-wide labels and annotations. */}}
{{- $ns := $entry }}
{{- $nsLabels := dict }}
{{- $nsAnnotations := dict }}
{{- if kindIs "map" $entry }}
{{- $ns = $entry.name }}
{{- $nsLabels = $entry.labels | default dict }}
{{- $nsAnnotations = $entry.annotations | default dict }}
{{- end }}
{{- if hasKey $seenNs $ns }}
{{- fail (printf "metricsNetworkPolicy.namespaces: %q appears twice" $ns) }}
{{- end }}
{{- $_ := set $seenNs $ns true }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $np.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "cnpg-platform.labels" $ | nindent 4 }}
    {{- with (merge (dict) $nsLabels ($np.labels | default dict)) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "cnpg-platform.annotations" (dict "root" $ "own" (merge (dict) $nsAnnotations ($np.annotations | default dict)))) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml $np.from | nindent 8 }}
      ports:
        - port: {{ $np.port }}
          protocol: TCP
{{- end }}
{{- end }}
