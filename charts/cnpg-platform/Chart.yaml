apiVersion: v2
name: cnpg-platform
description: >-
  Cluster-wide platform add-ons for a CloudNativePG install, beside the
  upstream operator (installed directly, not by this chart): storage classes,
  a metrics network policy, one PodMonitor for every instance pod, baseline
  alert rules and an admission guard against privileged database roles.
  The operator and barman-cloud plugin presets ship as values under
  examples/operator.
type: application
# Placeholder: the git tag is the sole version authority. The release
# workflow stamps both fields from the tag.
version: 0.0.0
appVersion: 0.0.0
home: https://github.com/truvity/cnpg
sources:
  - https://github.com/truvity/cnpg
keywords:
  - cloudnative-pg
  - postgresql
maintainers:
  - name: Truvity
    url: https://github.com/truvity
