apiVersion: v2
name: cnpg-restore-drill
description: >-
  Scheduled restore drills for CloudNativePG clusters that archive through the
  barman-cloud plugin: one CronJob per source cluster runs `cnpgctl drill`,
  which recovers the archive into a throwaway Cluster with the read-only
  restore identity, checks the result, records it and deletes everything it
  created; a small exporter serves the recorded results as metrics.
type: application
# Placeholder: the git tag is the sole version authority. The release
# workflow stamps both fields from the tag, and writes the cnpgctl image
# digest it built into images.cnpgctl.
version: 0.0.0
appVersion: 0.0.0
home: https://github.com/truvity/cnpg
sources:
  - https://github.com/truvity/cnpg
keywords:
  - cloudnative-pg
  - postgresql
  - backup
  - restore-drill
maintainers:
