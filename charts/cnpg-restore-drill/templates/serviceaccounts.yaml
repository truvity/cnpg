{{- /* One ServiceAccount per runner (one per drill) and one for the exporter
(component contract C14). None is a restore ServiceAccount: the archive is
read only by the drill Cluster's pods, which run as the ServiceAccount named
after the drill Cluster. */}}
{{- range include "cnpg-restore-drill.resolved" . | fromJsonArray }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cnpg-restore-drill.runnerName" .drillName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cnpg-restore-drill.labels" (dict "root" $ "component" "runner") | nindent 4 }}
    cnpg-restore-drill/drill-name: {{ .drillName }}
{{- end }}
{{- if and .Values.drills .Values.exporter.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cnpg-restore-drill.exporterName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-restore-drill.labels" (dict "root" . "component" "exporter") | nindent 4 }}
{{- end }}
