---
# Source: cnpg-cluster/templates/trust.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cnpg-app-pg-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: cnpg-app-pg client CA
  secretName: cnpg-app-pg-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Never
  issuerRef:
    name: cnpg-app-pg-selfsigned
    kind: Issuer
    group: cert-manager.io

---
# Source: cnpg-cluster/templates/cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: app
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enableSuperuserAccess: false
  # Explicit on both postures: CNPG defaults enablePDB to true, so a
  # devel single-instance cluster would otherwise get a primary PDB
  # with 0 allowed disruptions and block node drains until the node
  # pool's force-drain deadline (devel = no PDB).
  enablePDB: false
  postgresql:
    parameters:
      synchronous_commit: "off" # devel: fsync stays ON; test suites fly
      shared_buffers: "64MB"
    pg_hba:
      - hostssl all app-owner all scram-sha-256
      - hostssl all all all cert

  storage:
    size: 2Gi
    storageClass: cnpg-gp3-delete
    resizeInUseVolumes: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  affinity:

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: pg
  bootstrap:
    initdb:
      database: app
      owner: app-owner

---
# Source: cnpg-cluster/templates/trust.yaml
# Cluster-scoped, so the product namespace can neither read the CA key
# (it lives in cert-manager) nor sign with it: it can only ask, and the
# policy below decides.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cnpg-app-pg
spec:
  ca:
    secretName: cnpg-app-pg-ca

---
# Source: cnpg-cluster/templates/databases.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-app
  namespace: app
spec:
  name: app
  owner: app-owner
  ensure: present
  cluster:
    name: pg

---
# Source: cnpg-cluster/templates/roles.yaml
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: pg-my-app
  namespace: app
spec:
  cluster:
    name: pg
  name: my_app
  ensure: present
  login: true
  clientCertificate:
    enabled: true
  databaseRoleReclaimPolicy: retain

---
# Source: cnpg-cluster/templates/trust.yaml
# The root of this database's client trust: a self-signed issuer whose
# only job is to sign the CA below.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cnpg-app-pg-selfsigned
  namespace: cert-manager
spec:
  selfSigned: {}
