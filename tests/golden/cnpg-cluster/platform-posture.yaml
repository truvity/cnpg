---
# Source: cnpg-cluster/templates/trust.yaml
# approver-policy approves a request only when its requester may `use`
# a policy that admits it. The requester of a Certificate is
# cert-manager itself; bound in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-shop-shop-pg-policy-use
  labels:
    example.com/project: shop
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["cnpg-shop-shop-pg"]

---
# Source: cnpg-cluster/templates/trust.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-shop-shop-pg-policy-use
  namespace: shop
  labels:
    example.com/project: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-shop-shop-pg-policy-use
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager

---
# Source: cnpg-cluster/templates/trust.yaml
# trust-manager copies the CA certificate (never its key) into the
# database namespace as shop-pg-client-ca, where the
# Cluster's spec.certificates.clientCASecret reads it. A Bundle is
# cluster-scoped and its target Secret shares its name: the cluster name
# must therefore be unique across namespaces.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: shop-pg-client-ca
  labels:
    example.com/project: shop
spec:
  sources:
    - secret:
        name: cnpg-shop-shop-pg-ca
        key: ca.crt
    - inLine: |
        -----BEGIN CERTIFICATE-----
        MIIBexample
        -----END CERTIFICATE-----
  target:
    secret:
      key: ca.crt
      metadata:
        labels:
          cnpg.io/reload: "true"
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: shop

---
# Source: cnpg-cluster/templates/trust.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cnpg-shop-shop-pg-ca
  namespace: cert-manager
  labels:
    example.com/project: shop
spec:
  isCA: true
  commonName: cnpg-shop-shop-pg client CA
  secretName: cnpg-shop-shop-pg-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Never
  issuerRef:
    name: cnpg-shop-shop-pg-selfsigned
    kind: Issuer
    group: cert-manager.io

---
# Source: cnpg-cluster/templates/trust.yaml
# The replication client certificate, from this database's own CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop-pg-replication-tls
  namespace: shop
  labels:
    example.com/project: shop
spec:
  secretName: shop-pg-replication-tls
  commonName: streaming_replica
  usages:
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: cnpg-shop-shop-pg
    kind: ClusterIssuer
    group: cert-manager.io
  secretTemplate:
    labels:
      cnpg.io/reload: "true"

---
# Source: cnpg-cluster/templates/trust.yaml
# approver-policy: the ONLY namespace that may request from this
# ClusterIssuer is shop, for client-auth certificates
# whose CN is one of the roles below (or streaming_replica), ECDSA only.
# Anything else is denied, including DNS/IP/URI/email SANs.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: cnpg-shop-shop-pg
  labels:
    example.com/project: shop
spec:
  allowed:
    commonName:
      required: true
      validations:
        - rule: "self in ['shop_app', 'shop', 'streaming_replica']"
          message: "the common name must be one of the declared roles or streaming_replica"
    usages:
      - client auth
    isCA: false
  constraints:
    privateKey:
      algorithm: ECDSA
      minSize: 256
      maxSize: 521
  selector:
    issuerRef:
      name: cnpg-shop-shop-pg
      kind: ClusterIssuer
      group: cert-manager.io
    namespace:
      matchNames:
        - shop

---
# Source: cnpg-cluster/templates/cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-pg
  namespace: shop
  annotations:
    # Quorum-based failover protection is 1.30 ALPHA — enabled via
    # annotation, not spec (pkg/utils FailoverQuorumAnnotationName;
    # there is no spec.failoverQuorum field in the CRD).
    alpha.cnpg.io/failoverQuorum: "true"
  labels:
    example.com/project: shop
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enableSuperuserAccess: false
  # Explicit on both postures: CNPG defaults enablePDB to true, so a
  # devel single-instance cluster would otherwise get a primary PDB
  # with 0 allowed disruptions and block node drains until the node
  # pool's force-drain deadline (devel = no PDB).
  enablePDB: true
  # The Kubernetes Lease the primary holds and renews (CloudNativePG 1.30+).
  # The holder writes it every retryPeriodSeconds, so the audit log of a
  # cluster grows by one entry per renewal per database. A replica promotes
  # only after the lease has gone unrenewed for leaseDurationSeconds.
  primaryLease:
    leaseDurationSeconds: 60
    renewDeadlineSeconds: 40
    retryPeriodSeconds: 15
  certificates:
    # Secrets that already exist, named by serverTLS.existingSecret /
    # existingCASecret; the chart renders no object for them.
    serverTLSSecret: shop-pg-server-tls
    serverCASecret: shop-pg-server-ca
    # Per-database client CA (delivered by trust-manager, no ca.key) and
    # our own replication certificate: the operator accepts a client CA
    # without its key only when replicationTLSSecret is given too.
    clientCASecret: shop-pg-client-ca
    replicationTLSSecret: shop-pg-replication-tls
  inheritedMetadata:
    labels:
      example.com/project: shop
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
    parameters:
      max_slot_wal_keep_size: "2GB"
    pg_hba:
      - hostssl all shop all scram-sha-256
      - hostssl all shop_app all scram-sha-256
      - hostssl all shop_admin,shop_observer,shop_read all cert clientname=DN map=people
      - hostssl all all all cert
    pg_ident:
      - people "/^CN=[^,\\]+,OU=(shop_admin|shop_observer|shop_read)$" \1
      - people "/^OU=(shop_admin|shop_observer|shop_read),CN=[^,\\]+$" \1

  storage:
    size: 10Gi
    storageClass: cnpg-gp3
    resizeInUseVolumes: true
  walStorage:
    size: 5Gi
    storageClass: cnpg-gp3
    resizeInUseVolumes: true
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  affinity:
    podAntiAffinityType: required
    nodeSelector:
      karpenter.sh/nodepool: durable
    tolerations:
      - key: arch
        operator: Exists
      - effect: NoSchedule
        key: durable
        operator: Equal
        value: "true"
  probes:
    liveness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6 # ~60s — the 30s default self-fences on AWS blips
      isolationCheck:
        enabled: true
        # Integers per CRD schema (strings fail structured-merge diff).
        requestTimeout: 2000
        connectionTimeout: 2000

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: shop-pg
  bootstrap:
    initdb:
      database: shop
      owner: shop

---
# Source: cnpg-cluster/templates/trust.yaml
# Cluster-scoped, so the product namespace can neither read the CA key
# (it lives in cert-manager) nor sign with it: it can only ask, and the
# policy below decides.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cnpg-shop-shop-pg
  labels:
    example.com/project: shop
spec:
  ca:
    secretName: cnpg-shop-shop-pg-ca

---
# Source: cnpg-cluster/templates/databases.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: shop-pg-shop
  namespace: shop
spec:
  name: shop
  owner: shop
  ensure: present
  cluster:
    name: shop-pg

---
# Source: cnpg-cluster/templates/roles.yaml
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: shop-pg-shop-admin
  namespace: shop
spec:
  cluster:
    name: shop-pg
  name: shop_admin
  ensure: present
  login: true
  inRoles:
    - shop
  databaseRoleReclaimPolicy: retain

---
# Source: cnpg-cluster/templates/roles.yaml
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: shop-pg-shop-observer
  namespace: shop
spec:
  cluster:
    name: shop-pg
  name: shop_observer
  ensure: present
  login: true
  databaseRoleReclaimPolicy: retain

---
# Source: cnpg-cluster/templates/roles.yaml
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: shop-pg-shop-read
  namespace: shop
spec:
  cluster:
    name: shop-pg
  name: shop_read
  ensure: present
  login: true
  inRoles:
    - pg_read_all_data
  databaseRoleReclaimPolicy: retain

---
# Source: cnpg-cluster/templates/trust.yaml
# The root of this database's client trust: a self-signed issuer whose
# only job is to sign the CA below.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cnpg-shop-shop-pg-selfsigned
  namespace: cert-manager
  labels:
    example.com/project: shop
spec:
  selfSigned: {}
