---
# Source: cnpg-cluster/templates/stuck-reload.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-stuck-reload
  namespace: app
  labels:
    app.kubernetes.io/component: stuck-reload
    app.kubernetes.io/instance: pg
    app.kubernetes.io/name: cnpg-cluster-stuck-reload

---
# Source: cnpg-cluster/templates/stuck-reload.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pg-stuck-reload
  namespace: app
  labels:
    app.kubernetes.io/component: stuck-reload
    app.kubernetes.io/instance: pg
    app.kubernetes.io/name: cnpg-cluster-stuck-reload
rules:
  # The one Cluster it watches.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    resourceNames: [pg]
    verbs: [get]
  # The instance pods, found by label (list cannot be narrowed by name).
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  # pods/exec cannot be narrowed by label in RBAC, so this Role is
  # namespace-scoped: it can exec into any pod of the namespace. The binary
  # only ever execs the fixed `SELECT pg_reload_conf()` into this Cluster's
  # instance pods.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # The StuckReload Event on the Cluster (create cannot be narrowed by name).
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

