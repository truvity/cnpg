---
# Source: cnpg-cluster/templates/on-demand-backup.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: pg-g2
  namespace: app
  annotations:
    # An old id's Backup is a record of a base backup, not the backup: Argo CD
    # must not prune it when the id changes (docs/moving-to-a-new-backup-bucket.md).
    argocd.argoproj.io/sync-options: Prune=false
spec:
  cluster:
    name: pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: pg-objectstore

---
# Source: cnpg-cluster/templates/cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: app
  annotations:
    # guards.emptyBootstrap.allowNonEmptyArchive: the empty-bootstrap guard
    # is overridden, for this reason.
    cnpg-cluster/empty-bootstrap-override: "rehearsal: the archive dir is a copy restored by hand and is discarded after the test"
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enableSuperuserAccess: false
  # Explicit on both postures: CNPG defaults enablePDB to true, so a
  # devel single-instance cluster would otherwise get a primary PDB
  # with 0 allowed disruptions and block node drains until the node
  # pool's force-drain deadline (devel = no PDB).
  enablePDB: false
  postgresql:
    parameters:
      synchronous_commit: "off" # devel: fsync stays ON; test suites fly
      shared_buffers: "64MB"
    pg_hba:
      - hostssl all app-owner all scram-sha-256
      - hostssl all all all cert

  storage:
    size: 2Gi
    storageClass: cnpg-gp3-delete
    resizeInUseVolumes: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  affinity:

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: pg
  bootstrap:
    initdb:
      database: app
      owner: app-owner
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      # v2: TRUE — continuous WAL archiving is the point; false only ever
      # made sense while nothing consumed the archive.
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-objectstore
        serverName: app-pg-g2

---
# Source: cnpg-cluster/templates/databases.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-app
  namespace: app
spec:
  name: app
  owner: app-owner
  ensure: present
  cluster:
    name: pg

---
# Source: cnpg-cluster/templates/objectstore.yaml
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-objectstore
  namespace: app
spec:
  configuration:
    destinationPath: s3://example-pg-app-staging-eu-west-1/app/pg
    # Object tags on every base backup and WAL upload (barman --tags); the
    # bucket lifecycle selects on them (docs/backupstore.md).
    tags:
      cnpg-backup-retention: managed
    # Object tags on the timeline history files only (barman --history-tags).
    historyTags:
      cnpg-backup-retention: keep
    s3Credentials:
      inheritFromIAMRole: true # the pod's ambient identity, bound by the platform
    data:
      # Base backups: the CRD enum here is narrower than WAL's (no
      # zstd/xz — found by a server-side dry-run against the plugin).
      compression: snappy
      encryption: AES256
      jobs: 2
    wal:
      compression: zstd
      encryption: AES256
      maxParallel: 4

---
# Source: cnpg-cluster/templates/scheduled-backup.yaml
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-scheduled-backup
  namespace: app
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: pg-objectstore
