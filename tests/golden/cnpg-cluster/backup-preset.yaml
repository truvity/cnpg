---
# Source: cnpg-cluster/templates/on-demand-backup.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: pg-g2
  namespace: app
  annotations:
    # An old id's Backup is a record of a base backup, not the backup: Argo CD
    # must not prune it when the id changes (docs/moving-to-a-new-backup-bucket.md).
    argocd.argoproj.io/sync-options: Prune=false
spec:
  cluster:
    name: pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: pg-objectstore

---
# Source: cnpg-cluster/templates/cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: app
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enableSuperuserAccess: false
  # Explicit on both postures: CNPG defaults enablePDB to true, so a
  # devel single-instance cluster would otherwise get a primary PDB
  # with 0 allowed disruptions and block node drains until the node
  # pool's force-drain deadline (devel = no PDB).
  enablePDB: false
  # The Kubernetes Lease the primary holds and renews (CloudNativePG 1.30+).
  # The holder writes it every retryPeriodSeconds, so the audit log of a
  # cluster grows by one entry per renewal per database. A replica promotes
  # only after the lease has gone unrenewed for leaseDurationSeconds.
  primaryLease:
    leaseDurationSeconds: 60
    renewDeadlineSeconds: 40
    retryPeriodSeconds: 15
  postgresql:
    parameters:
      synchronous_commit: "off" # devel: fsync stays ON; test suites fly
      shared_buffers: "64MB"
    pg_hba:
      - hostssl all app-owner all scram-sha-256
      - hostssl all all all cert

  storage:
    size: 2Gi
    storageClass: cnpg-gp3-delete
    resizeInUseVolumes: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  affinity:

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: pg
  bootstrap:
    initdb:
      database: app
      owner: app-owner
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      # v2: TRUE — continuous WAL archiving is the point; false only ever
      # made sense while nothing consumed the archive.
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-objectstore
        serverName: app-pg-g2

---
# Source: cnpg-cluster/templates/databases.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-app
  namespace: app
spec:
  name: app
  owner: app-owner
  ensure: present
  cluster:
    name: pg

---
# Source: cnpg-cluster/templates/roles.yaml
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: pg-my-app
  namespace: app
spec:
  cluster:
    name: pg
  name: my_app
  ensure: present
  login: true
  clientCertificate:
    enabled: true
  databaseRoleReclaimPolicy: retain

---
# Source: cnpg-cluster/templates/objectstore.yaml
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-objectstore
  namespace: app
spec:
  configuration:
    destinationPath: s3://example-pg-app-staging-eu-west-1/app/pg
    # Object tags on every base backup and WAL upload (barman --tags); the
    # bucket lifecycle selects on them (docs/backupstore.md).
    tags:
      cnpg-backup-retention: managed
    # Object tags on the timeline history files only (barman --history-tags).
    historyTags:
      cnpg-backup-retention: keep
    s3Credentials:
      inheritFromIAMRole: true # the pod's ambient identity, bound by the platform
    data:
      # Base backups: the CRD enum here is narrower than WAL's (no
      # zstd/xz — found by a server-side dry-run against the plugin).
      compression: snappy
      encryption: AES256
      jobs: 2
    wal:
      compression: zstd
      encryption: AES256
      maxParallel: 4

---
# Source: cnpg-cluster/templates/scheduled-backup.yaml
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-scheduled-backup
  namespace: app
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: pg-objectstore
---
# Source: cnpg-cluster/templates/bootstrap-guard.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pg-bootstrap-guard
  namespace: app
  labels:
    app.kubernetes.io/component: bootstrap-guard
    app.kubernetes.io/instance: pg
    app.kubernetes.io/name: cnpg-cluster-bootstrap-guard
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-11"
rules:
  # Whether this one Cluster exists: nothing else.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    resourceNames: [pg]
    verbs: [get]

---
# Source: cnpg-cluster/templates/bootstrap-guard.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pg-bootstrap-guard
  namespace: app
  labels:
    app.kubernetes.io/component: bootstrap-guard
    app.kubernetes.io/instance: pg
    app.kubernetes.io/name: cnpg-cluster-bootstrap-guard
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-11"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pg-bootstrap-guard
subjects:
  - kind: ServiceAccount
    name: pg-restore
    namespace: app

---
# Source: cnpg-cluster/templates/bootstrap-guard.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-bootstrap-guard
  namespace: app
  labels:
    app.kubernetes.io/component: bootstrap-guard
    app.kubernetes.io/instance: pg
    app.kubernetes.io/name: cnpg-cluster-bootstrap-guard
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-10"
spec:
  # A refusal (exit 1) fails the Job at once; an error (exit 2: the API or
  # the store did not answer) is retried twice, within the deadline.
  backoffLimit: 2
  activeDeadlineSeconds: 300
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: guard
          operator: In
          values: [1]
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bootstrap-guard
        app.kubernetes.io/instance: pg
        app.kubernetes.io/name: cnpg-cluster-bootstrap-guard
    spec:
      serviceAccountName: pg-restore
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guard
          image: ghcr.io/truvity/cnpg/cnpgctl:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - guard
            - empty-bootstrap
            - --namespace=app
            - --cluster=pg
            - --bootstrap=initdb
            - --destination=s3://example-pg-app-staging-eu-west-1/app/pg
            - --server-name=app-pg-g2
            - --region=eu-west-1
          # The verdict is the last log line; a failed pod shows it as its
          # termination message.
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
