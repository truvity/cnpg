---
# Source: cnpg-cluster/templates/cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: app
  annotations:
    # Quorum-based failover protection is 1.30 ALPHA — enabled via
    # annotation, not spec (pkg/utils FailoverQuorumAnnotationName;
    # there is no spec.failoverQuorum field in the CRD).
    alpha.cnpg.io/failoverQuorum: "true"
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  enableSuperuserAccess: false
  # Explicit on both postures: CNPG defaults enablePDB to true, so a
  # devel single-instance cluster would otherwise get a primary PDB
  # with 0 allowed disruptions and block node drains until the node
  # pool's force-drain deadline (devel = no PDB).
  enablePDB: true
  inheritedMetadata:
    annotations:
      # karpenter.doNotDisrupt: Karpenter never evicts an instance pod. Off
      # by default: on a WhenEmpty pool the operator's switchover (it
      # watches karpenter.sh/disrupted) and its PodDisruptionBudgets drain
      # the instances safely; on for a pool that consolidates busy nodes.
      karpenter.sh/do-not-disrupt: "true"
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
    parameters:
      max_slot_wal_keep_size: "2GB"
    pg_hba:
      - hostssl all app-owner all scram-sha-256
      - hostssl all all all cert

  storage:
    size: 10Gi
    storageClass: cnpg-gp3
    resizeInUseVolumes: true
  walStorage:
    size: 5Gi
    storageClass: cnpg-gp3
    resizeInUseVolumes: true
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  affinity:
    podAntiAffinityType: required
    nodeSelector:
      karpenter.sh/nodepool: general
    tolerations:
      - effect: NoSchedule
        key: general
        operator: Equal
        value: "true"
  probes:
    liveness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6 # ~60s — the 30s default self-fences on AWS blips
      isolationCheck:
        enabled: true
        # Integers per CRD schema (strings fail structured-merge diff).
        requestTimeout: 2000
        connectionTimeout: 2000

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: pg
  bootstrap:
    initdb:
      database: app
      owner: app-owner

---
# Source: cnpg-cluster/templates/databases.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-app
  namespace: app
spec:
  name: app
  owner: app-owner
  ensure: present
  cluster:
    name: pg
