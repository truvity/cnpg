---
# Source: cnpg-client-consumer/templates/app.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-client-cnpg-pg
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: app
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: "pg"
      ports:
        - protocol: TCP
          port: 5432

---
# Source: cnpg-client-consumer/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: cnpg-client
          projected:
            sources:
              - secret:
                  name: pg-role-app
                  items:
                    - key: tls.crt
                      path: tls.crt
                      mode: 0444
                    - key: tls.key
                      path: tls.key
                      mode: 0440
                    - key: key.der
                      path: key.der
                      mode: 0440
              - secret:
                  name: pg-server-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
                      mode: 0444
      containers:
        - name: app
          image: example.invalid/app:1
          env:
            - name: PGHOST
              value: "pg-rw.default.svc"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "appdb"
            - name: PGUSER
              value: "app"
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: "/var/run/cnpg-client/ca.crt"
            - name: PGSSLCERT
              value: "/var/run/cnpg-client/tls.crt"
            - name: PGSSLKEY
              value: "/var/run/cnpg-client/tls.key"
            - name: JDBC_URL
              value: "jdbc:postgresql://pg-rw.default.svc:5432/appdb?user=app&sslmode=verify-full&sslfactory=org.postgresql.ssl.SingleCertValidatingFactory&sslrootcert=/var/run/cnpg-client/ca.crt&sslcert=/var/run/cnpg-client/tls.crt&sslkey=/var/run/cnpg-client/key.der"
          volumeMounts:
            - name: cnpg-client
              mountPath: "/var/run/cnpg-client"
              readOnly: true
