---
# Source: cnpg-client-consumer/templates/app.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-to-pg
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: app
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: "pg"
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "data"
      ports:
        - protocol: TCP
          port: 5432

---
# Source: cnpg-client-consumer/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: cnpg-client
          projected:
            sources:
              - secret:
                  name: pg-role-app
                  items:
                    - key: tls.crt
                      path: tls.crt
                      mode: 0444
                    - key: tls.key
                      path: tls.key
                      mode: 0440
              - secret:
                  name: pg-server-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
                      mode: 0444
      containers:
        - name: app
          image: example.invalid/app:1
          env:
            - name: PGHOST
              value: "pg-rw.data.svc.example.test"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "app"
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: "/var/run/cnpg-client/ca.crt"
            - name: PGSSLCERT
              value: "/var/run/cnpg-client/tls.crt"
            - name: PGSSLKEY
              value: "/var/run/cnpg-client/tls.key"
          volumeMounts:
            - name: cnpg-client
              mountPath: "/var/run/cnpg-client"
              readOnly: true
