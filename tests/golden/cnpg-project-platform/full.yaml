---
# Source: cnpg-project-platform/templates/servertls.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: one-pg-server
  namespace: one
  labels:
    example.com/team: data
    example.com/tier: primary
  annotations:
    example.com/owner: platform
    example.com/wave: "15"
spec:
  secretName: one-pg-tls
  dnsNames:
    - one-pg-rw.one.svc.cluster.local
    - one-pg-ro.one.svc.cluster.local
    - one-pg-r.one.svc.cluster.local
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 384
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-issuer
  # CloudNativePG reloads a user-provided server Secret only when it carries
  # cnpg.io/reload: without it a renewal is not served until the instance
  # restarts.
  secretTemplate:
    labels:
      cnpg.io/reload: "true"

