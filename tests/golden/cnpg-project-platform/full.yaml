  # restarts.
  secretTemplate:
    labels:
      cnpg.io/reload: "true"

---
# Source: cnpg-project-platform/templates/objectstores.yaml
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: one-objectstore
  namespace: one
  labels:
    example.com/team: data
    example.com/tier: primary
  annotations:
    example.com/owner: platform
    example.com/wave: "20"
spec:
  configuration:
    destinationPath: s3://example-bucket/one/one-pg
    s3Credentials:
      inheritFromIAMRole: true # the pod's ambient identity
    data:
      compression: gzip
      encryption: aws:kms
      jobs: 3
    wal:
      compression: xz
      encryption: aws:kms
      maxParallel: 8
  # The FUNCTIONAL PITR window; a bucket lifecycle rule, if any, is only a
  # backstop and must outlive it.
  retentionPolicy: 14d

---
# Source: cnpg-project-platform/templates/objectstores.yaml
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: two-objectstore
  namespace: two
  labels:
    example.com/team: data
  annotations:
    example.com/owner: platform
spec:
  configuration:
    destinationPath: s3://example-bucket/two/two-pg
    s3Credentials:
      inheritFromIAMRole: true # the pod's ambient identity
    data:
      jobs: 2
    wal:
      compression: zstd
      maxParallel: 4
  # The FUNCTIONAL PITR window; a bucket lifecycle rule, if any, is only a
  # backstop and must outlive it.
  retentionPolicy: 30d

---
# Source: cnpg-project-platform/templates/scheduledbackups.yaml
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: one-pg-scheduled-backup
  namespace: one
  labels:
    example.com/team: data
    example.com/tier: primary
  annotations:
    example.com/owner: platform
    example.com/wave: "25"
spec:
  schedule: "0 30 3 * * *"
  backupOwnerReference: self
  method: plugin
  cluster:
    name: one-pg
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: one-objectstore

