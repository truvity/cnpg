# Source: cnpg-backup-access/templates/access.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: prod-pg-shop-pg-archive
  namespace: default
  annotations:
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  name: prod-pg-shop-pg-archive
  description: "CNPG archive access to example-backup for shop/shop-pg"
  assumeRolePolicyDocument: "{\"Statement\":[{\"Action\":[\"sts:AssumeRole\",\"sts:TagSession\"],\"Condition\":{\"ArnEquals\":{\"aws:SourceArn\":\"arn:aws:eks:eu-west-1:123456789012:cluster/example-eks\"},\"StringEquals\":{\"aws:RequestTag/kubernetes-namespace\":\"shop\",\"aws:RequestTag/kubernetes-service-account\":\"shop-pg\",\"aws:SourceAccount\":\"123456789012\"}},\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"pods.eks.amazonaws.com\"}}],\"Version\":\"2012-10-17\"}"
  inlinePolicies:
    cnpg-backup-archive: "{\"Statement\":[{\"Action\":[\"s3:PutObject\"],\"Condition\":{\"StringEquals\":{\"s3:x-amz-server-side-encryption\":\"AES256\"}},\"Effect\":\"Allow\",\"Resource\":\"arn:aws:s3:::example-backup/shop/shop-pg/*\",\"Sid\":\"Put1Archive\"},{\"Action\":[\"s3:AbortMultipartUpload\",\"s3:ListMultipartUploadParts\",\"s3:GetObject\",\"s3:PutObjectTagging\"],\"Effect\":\"Allow\",\"Resource\":\"arn:aws:s3:::example-backup/shop/shop-pg/*\",\"Sid\":\"Object1Archive\"},{\"Action\":[\"s3:ListBucket\"],\"Effect\":\"Allow\",\"Resource\":\"arn:aws:s3:::example-backup\",\"Sid\":\"List1Archive\"}],\"Version\":\"2012-10-17\"}"

