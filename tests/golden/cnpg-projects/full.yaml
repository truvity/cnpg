# Source: cnpg-projects/templates/backup-access.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: example-pg-backup-alpha
  namespace: platform-system
spec:
  name: example-pg-backup-alpha
  description: "alpha: CNPG archive and restore"
  permissionsBoundary: arn:aws:iam::123456789012:policy/example-boundary
  assumeRolePolicyDocument: "{\"Statement\":[{\"Action\":[\"sts:AssumeRole\",\"sts:TagSession\"],\"Condition\":{\"ArnEquals\":{\"aws:SourceArn\":\"arn:aws:eks:eu-central-1:123456789012:cluster/example\"},\"StringEquals\":{\"aws:RequestTag/kubernetes-namespace\":\"alpha\",\"aws:RequestTag/kubernetes-service-account\":[\"alpha-pg\",\"alpha-rehearsal-pg\"],\"aws:SourceAccount\":\"123456789012\"}},\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"pods.eks.amazonaws.com\"}}],\"Version\":\"2012-10-17\"}"
  inlinePolicies:
    cnpg-backup: "{\"Statement\":[{\"Action\":[\"s3:PutObject\",\"s3:GetObject\",\"s3:DeleteObject\",\"s3:AbortMultipartUpload\",\"s3:ListMultipartUploadParts\"],\"Effect\":\"Allow\",\"Resource\":\"arn:aws:s3:::example-backups/alpha/alpha-pg/*\",\"Sid\":\"WriteOwnSubtree\"},{\"Action\":[\"s3:GetObject\"],\"Effect\":\"Allow\",\"Resource\":\"arn:aws:s3:::example-backups/alpha/*\",\"Sid\":\"ReadProjectPrefix\"},{\"Action\":[\"s3:ListBucket\",\"s3:ListBucketMultipartUploads\"],\"Condition\":{\"StringLikeIfExists\":{\"s3:prefix\":\"alpha/*\"}},\"Effect\":\"Allow\",\"Resource\":\"arn:aws:s3:::example-backups\",\"Sid\":\"ListProjectPrefix\"},{\"Action\":[\"kms:Encrypt\",\"kms:Decrypt\",\"kms:ReEncrypt*\",\"kms:GenerateDataKey*\",\"kms:DescribeKey\"],\"Effect\":\"Allow\",\"Resource\":\"arn:aws:kms:eu-central-1:123456789012:key/example\",\"Sid\":\"UseBackupKey\"}],\"Version\":\"2012-10-17\"}"

