# Source: cnpg-projects/templates/clusters.yaml
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: alpha-pg-objectstore
  namespace: alpha
  annotations:
    example.com/keep: "true"
spec:
  configuration:
    destinationPath: s3://example-backups/alpha/alpha-pg
    s3Credentials:
      inheritFromIAMRole: true # the pod's ambient identity, bound by the platform
    data:
      # Base backups: the CRD enum here is narrower than WAL's (no
      # zstd/xz — found by a server-side dry-run against the plugin).
      compression: snappy
      encryption: AES256
      jobs: 2
    wal:
      compression: zstd
      encryption: AES256
      maxParallel: 4
  # The FUNCTIONAL PITR window; a bucket lifecycle rule, if any, is
  # the platform's backstop and must outlive it.
  retentionPolicy: 30d

