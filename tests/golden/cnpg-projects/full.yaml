apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: alpha-pg-scheduled-backup
  namespace: alpha
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  method: plugin
  cluster:
    name: alpha-pg
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: alpha-pg-objectstore
