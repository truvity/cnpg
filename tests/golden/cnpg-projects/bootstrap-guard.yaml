# Source: cnpg-projects/templates/clusters.yaml
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: alpha-pg-objectstore
  namespace: alpha
spec:
  configuration:
    destinationPath: s3://example-pg-alpha-staging-eu-west-1/alpha/alpha-pg
    # Object tags on every base backup and WAL upload (barman --tags); the
    # bucket lifecycle selects on them (docs/backupstore.md).
    tags:
      cnpg-backup-retention: managed
    # Object tags on the timeline history files only (barman --history-tags).
    historyTags:
      cnpg-backup-retention: keep
    s3Credentials:
      inheritFromIAMRole: true # the pod's ambient identity, bound by the platform
    data:
      # Base backups: the CRD enum here is narrower than WAL's (no
      # zstd/xz — found by a server-side dry-run against the plugin).
      compression: snappy
      encryption: AES256
      jobs: 2
    wal:
      compression: zstd
      encryption: AES256
      maxParallel: 4

