apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: alpha-pg-g4
  namespace: alpha
  annotations:
    # An old id's Backup is a record of a base backup, not the backup: Argo CD
    # must not prune it when the id changes (docs/moving-to-a-new-backup-bucket.md).
    argocd.argoproj.io/sync-options: Prune=false
spec:
  cluster:
    name: alpha-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: alpha-pg-objectstore

