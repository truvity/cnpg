---
# Source: cnpg-projects/templates/clusters.yaml
# Cluster-scoped, so the product namespace can neither read the CA key
# (it lives in cert-manager) nor sign with it: it can only ask, and the
# policy below decides.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cnpg-alpha-alpha-pg
spec:
  ca:
    secretName: cnpg-alpha-alpha-pg-ca

---
# Source: cnpg-projects/templates/clusters.yaml
# Cluster-scoped, so the product namespace can neither read the CA key
# (it lives in cert-manager) nor sign with it: it can only ask, and the
