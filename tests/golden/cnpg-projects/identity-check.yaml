# Source: cnpg-projects/templates/identity-check.yaml
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-20"
  labels:
    app.kubernetes.io/component: alpha-pg-identity-check
    app.kubernetes.io/instance: cnpg-projects
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cnpg-projects-identity-check
    app.kubernetes.io/version: 0.0.0
    service-lib.io/identity-check: "true"
  name: cnpg-projects-alpha-pg-identity-check
  namespace: alpha
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: alpha-pg-identity-check
        app.kubernetes.io/instance: cnpg-projects
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: cnpg-projects-identity-check
        app.kubernetes.io/version: 0.0.0
        service-lib.io/identity-check: "true"
    spec:
      containers:
      - args:
        - -expect-role
        - example-alpha-pg-archive
        image: ghcr.io/truvity/k8s/identity-check@sha256:9fc40a066f5455eb807f0826f7083b0ead46924956af3c8ed5e2c381233d1a38
        imagePullPolicy: IfNotPresent
        name: identity-check
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      restartPolicy: Never
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: alpha-pg

