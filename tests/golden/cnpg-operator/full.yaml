# Source: cnpg-operator/templates/database-role-guard.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pg-role-guard
  labels:
    app.kubernetes.io/name: cnpg-operator
    app.kubernetes.io/instance: cnpg-operator
    app.kubernetes.io/managed-by: Helm
    example.com/team: data
  annotations:
    example.com/owner: platform
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["databaseroles"]
  validations:
    - expression: "!has(object.spec.superuser) || object.spec.superuser == false"
      message: "a DatabaseRole may not set superuser: that attribute is the platform's to grant"
      reason: Forbidden
    - expression: "!has(object.spec.replication) || object.spec.replication == false"
      message: "a DatabaseRole may not set replication: that attribute is the platform's to grant"
      reason: Forbidden
    - expression: "!has(object.spec.bypassrls) || object.spec.bypassrls == false"
      message: "a DatabaseRole may not set bypassrls: that attribute is the platform's to grant"
      reason: Forbidden
    - expression: "!has(object.spec.createrole) || object.spec.createrole == false"
      message: "a DatabaseRole may not set createrole: that attribute is the platform's to grant"
      reason: Forbidden

