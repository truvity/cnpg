---
# Source: cnpg-restore-drill/templates/exporter.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-restore-drill-exporter
  namespace: drills
  labels:
    app.kubernetes.io/name: cnpg-restore-drill
    app.kubernetes.io/instance: cnpg-restore-drill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cnpg-restore-drill
      app.kubernetes.io/instance: cnpg-restore-drill
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnpg-restore-drill
        app.kubernetes.io/instance: cnpg-restore-drill
        app.kubernetes.io/component: exporter
    spec:
      serviceAccountName: cnpg-restore-drill-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/truvity/cnpg/cnpgctl:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - drill-metrics
            - --namespace=drills
            - --listen=:8080
            - --source=shop/shop-pg=shop-pg-restore
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 5m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

---
# Source: cnpg-restore-drill/templates/cronjobs.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shop-pg-restore
  namespace: drills
  labels:
    app.kubernetes.io/name: cnpg-restore-drill
    app.kubernetes.io/instance: cnpg-restore-drill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: runner
    cnpg-restore-drill/source-namespace: shop
    cnpg-restore-drill/source-cluster: shop-pg
spec:
  schedule: "36 14 17 * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  suspend: false
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: cnpg-restore-drill
        app.kubernetes.io/instance: cnpg-restore-drill
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: runner
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 9000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-restore-drill
            app.kubernetes.io/instance: cnpg-restore-drill
            app.kubernetes.io/component: runner
            cnpg-restore-drill/source-namespace: shop
            cnpg-restore-drill/source-cluster: shop-pg
            cnpg-restore-drill/drill-name: shop-pg-restore
        spec:
          serviceAccountName: shop-pg-restore-runner
          restartPolicy: Never
          # cnpgctl tears the drill down after a SIGTERM (teardown timeout 10m).
          terminationGracePeriodSeconds: 660
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drill
              image: ghcr.io/truvity/cnpg/cnpgctl:0.0.0
              imagePullPolicy: IfNotPresent
              args:
                - drill
                - --namespace=shop
                - --cluster=shop-pg
                - --drill-namespace=drills
                - --drill-name=shop-pg-restore
                - --timeout=120m
                - --storage-class=example-delete
                - --count=exact
                - --max-recovery-point-age=24h
                - --statement-timeout=15m
                - --max-recovery-attempts=2
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
