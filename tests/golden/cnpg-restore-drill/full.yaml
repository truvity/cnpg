apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-pg-restore-runner
  namespace: drills
  labels:
    app.kubernetes.io/name: cnpg-restore-drill
    app.kubernetes.io/instance: cnpg-restore-drill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: runner
    example.com/part-of: databases
    cnpg-restore-drill/drill-name: shop-pg-restore
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [create]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, delete]
    resourceNames: [shop-pg-restore]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [create]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, delete]
    resourceNames: [shop-pg-restore-source]
  # The drill's pods, events and logs, for the progress and the diagnostics;
  # its volume claims, to wait for the teardown.
  - apiGroups: [""]
    resources: [pods, events, persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The superuser and CA Secrets the operator creates for the drill Cluster.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [shop-pg-restore-superuser, shop-pg-restore-ca]
  # The result ConfigMap.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, update]
    resourceNames: [shop-pg-restore-result]

