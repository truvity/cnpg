# Source: cnpg-restore-drill/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-restore-drill-drill-instances
  namespace: drills
  labels:
    app.kubernetes.io/name: cnpg-restore-drill
    app.kubernetes.io/instance: cnpg-restore-drill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: drill
    example.com/part-of: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/podRole: instance
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values: ["shop-pg-restore","ledger-drill"]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cnpg-restore-drill
              app.kubernetes.io/instance: cnpg-restore-drill
              app.kubernetes.io/component: runner
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 8000
          protocol: TCP

