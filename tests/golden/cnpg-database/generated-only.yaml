---
# Source: cnpg-database/templates/database.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-shop
  namespace: shop
spec:
  name: shop
  owner: shop_owner
  cluster:
    name: pg

---
# Source: cnpg-database/templates/roles.yaml
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: pg-role-shop-reader
  namespace: shop
spec:
  cluster:
    name: pg
  name: shop_reader
  ensure: present
  login: true
  passwordSecret:
    name: shop-reader-password

---
# Source: cnpg-database/templates/roles.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-app-credentials
  namespace: shop
  labels:
    app.kubernetes.io/instance: shop
    app.kubernetes.io/name: shop-infra
spec:
  # Generated once and never refreshed: a refresh would mint a new password
  # and lock out every pod holding the old one.
  refreshInterval: "0"
  target:
    name: shop-app-credentials
    template:
      # basic-auth is what the operator reads a managed role's credential from.
      type: kubernetes.io/basic-auth
      data:
        username: "shop_app"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: shop-app-credentials

---
# Source: cnpg-database/templates/roles.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acme-worker-credentials
  namespace: shop
  labels:
    team: acme
spec:
  # Generated once and never refreshed: a refresh would mint a new password
  # and lock out every pod holding the old one.
  refreshInterval: "0"
  target:
    name: acme-worker-credentials
    template:
      # basic-auth is what the operator reads a managed role's credential from.
      type: kubernetes.io/basic-auth
      data:
        username: "acme_worker"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: acme-worker-credentials

---
# Source: cnpg-database/templates/roles.yaml
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: shop-app-credentials
  namespace: shop
  labels:
    app.kubernetes.io/instance: shop
    app.kubernetes.io/name: shop-infra
spec:
  length: 32
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true

---
# Source: cnpg-database/templates/roles.yaml
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: acme-worker-credentials
  namespace: shop
  labels:
    team: acme
spec:
  length: 48
  digits: 5
  symbols: 2
  noUpper: false
  allowRepeat: true
