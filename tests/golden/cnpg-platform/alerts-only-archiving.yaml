---
# Source: cnpg-platform/templates/alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-baseline
  namespace: default
  labels:
    app.kubernetes.io/name: cnpg-platform
    app.kubernetes.io/instance: cnpg-platform
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: cnpg-baseline
      rules:
        - alert: CnpgWalArchivingFailing
          expr: "cnpg_pg_stat_archiver_last_failed_time{} > cnpg_pg_stat_archiver_last_archived_time{}"
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving is failing on {{ $labels.pod }}"
            description: "The last failed WAL archive is newer than the last successful one. Point-in-time recovery is degrading and WAL is accumulating on the volume."
        - alert: CnpgManualSwitchoverRequired
          expr: "cnpg_collector_manual_switchover_required{} > 0"
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} waits for a manual switchover"
            description: "The cluster's primary needs a restart (an update, a changed parameter) and primaryUpdateStrategy is supervised: the operator waits for a person to switch over before it restarts the primary, and the rolling update stays half done until then."
            runbook_url: "https://github.com/truvity/cnpg/blob/master/docs/runbooks.md#cnpgmanualswitchoverrequired"
        - alert: CnpgInstanceFenced
          expr: "cnpg_collector_fencing_on{} > 0"
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is fenced"
            description: "The instance is fenced (the Cluster's cnpg.io/fencedInstances annotation names it, or \"*\"): PostgreSQL is stopped on it and it serves nothing. A fence is a deliberate, temporary step; lift it once the investigation that needed it is done."
            runbook_url: "https://github.com/truvity/cnpg/blob/master/docs/runbooks.md#cnpginstancefenced"
