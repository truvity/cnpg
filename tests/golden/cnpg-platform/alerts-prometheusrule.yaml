---
# Source: cnpg-platform/templates/alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-baseline
  namespace: default
  labels:
    app.kubernetes.io/name: cnpg-platform
    app.kubernetes.io/instance: cnpg-platform
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: cnpg-baseline
      rules:
        - alert: CnpgWalArchivingFailing
          expr: "cnpg_pg_stat_archiver_last_failed_time{} > cnpg_pg_stat_archiver_last_archived_time{}"
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving is failing on {{ $labels.pod }}"
            description: "The last failed WAL archive is newer than the last successful one. Point-in-time recovery is degrading and WAL is accumulating on the volume."
        - alert: CnpgBackupTooOld
          expr: "time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{} > 172800"
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No recent backup for {{ $labels.pod }}"
            description: "The newest successful backup recorded by the barman-cloud plugin is older than 172800 seconds, or there is none."
        - alert: CnpgReplicationLagHigh
          expr: "cnpg_pg_replication_lag{} > 300"
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Replica {{ $labels.pod }} is lagging"
            description: "Replication lag has exceeded 300 seconds."
        - alert: CnpgCertificateExpiring
          expr: "certmanager_certificate_expiration_timestamp_seconds{name=~\"pg-.*\"} - time() < 14 * 86400"
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} expires soon"
            description: "Fewer than 14 days remain. A renewal that has not happened by now is stuck."
        - alert: CnpgCertificateExpiryImminent
          expr: "certmanager_certificate_expiration_timestamp_seconds{name=~\"pg-.*\"} - time() < 3 * 86400"
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.name }} is about to expire"
            description: "Fewer than 3 days remain."
        - alert: CnpgWalVolumeFillingUp
          expr: "kubelet_volume_stats_available_bytes{persistentvolumeclaim=~\".*-wal\"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~\".*-wal\"} < 0.15"
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "WAL volume {{ $labels.persistentvolumeclaim }} is nearly full"
            description: "Less than 0.15 of the volume is free. A full WAL volume stops the instance."
        - alert: CnpgInstanceExporterDown
          expr: "cnpg_collector_up{} == 0"
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The metrics exporter on {{ $labels.pod }} cannot reach PostgreSQL"
            description: "cnpg_collector_up is 0: the instance's exporter is up but its database connection is not, so the cnpg_pg_* series the other rules read are missing or stale."
        - alert: CnpgInstanceScrapeDown
          expr: "up{container=\"postgres\",job=~\".+/.+\"} == 0"
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "The metrics of {{ $labels.pod }} are not being scraped"
            description: "The scrape target of a CloudNativePG instance has been down: its exporter is hung or unreachable (a network policy, a TLS mismatch), so the lag, archiving and HA rules cannot see the instance."
        - alert: CnpgBackupNotConfigured
          expr: "cnpg_collector_up{cnpg_cluster_backup_expected!=\"false\"} unless on (namespace, pod) barman_cloud_cloudnative_pg_io_last_available_backup_timestamp"
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No backup is configured for {{ $labels.pod }}"
            description: "The instance exports no barman-cloud backup metric, so CnpgBackupTooOld cannot see it: backups are not configured. Configure them, or, if this cluster is deliberately not backed up, opt out in the cnpg-cluster chart with backup.expected=false and a backup.notExpectedReason."
