---
# Source: cnpg-platform/templates/alerts.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cnpg-baseline
  namespace: default
  labels:
    app.kubernetes.io/name: cnpg-platform
    app.kubernetes.io/instance: cnpg-platform
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: cnpg-baseline
      rules:
        - alert: CnpgWalArchivingFailing
          expr: "cnpg_pg_stat_archiver_last_failed_time{namespace=~\"pg-.*\"} > cnpg_pg_stat_archiver_last_archived_time{namespace=~\"pg-.*\"}"
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving is failing on {{ $labels.pod }}"
            description: "The last failed WAL archive is newer than the last successful one. Point-in-time recovery is degrading and WAL is accumulating on the volume."
        - alert: CnpgBackupTooOld
          expr: "time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace=~\"pg-.*\"} > 172800"
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No recent backup for {{ $labels.pod }}"
            description: "The newest successful backup recorded by the barman-cloud plugin is older than 172800 seconds, or there is none."
        - alert: CnpgInstanceExporterDown
          expr: "cnpg_collector_up{namespace=~\"pg-.*\"} == 0"
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The metrics exporter on {{ $labels.pod }} cannot reach PostgreSQL"
            description: "cnpg_collector_up is 0: the instance's exporter is up but its database connection is not, so the cnpg_pg_* series the other rules read are missing or stale."
        - alert: CnpgInstanceScrapeDown
          expr: "up{container=\"postgres\",job=~\".+/.+\", namespace=~\"pg-.*\"} == 0"
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "The metrics of {{ $labels.pod }} are not being scraped"
            description: "The scrape target of a CloudNativePG instance has been down: its exporter is hung or unreachable (a network policy, a TLS mismatch), so the lag, archiving and HA rules cannot see the instance."
