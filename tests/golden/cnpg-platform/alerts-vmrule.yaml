---
# Source: cnpg-platform/templates/alerts.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cnpg-baseline
  namespace: default
  labels:
    app.kubernetes.io/name: cnpg-platform
    app.kubernetes.io/instance: cnpg-platform
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: cnpg-baseline
      rules:
        - alert: CnpgWalArchivingFailing
          expr: "cnpg_pg_stat_archiver_last_failed_time{namespace=~\"pg-.*\"} > cnpg_pg_stat_archiver_last_archived_time{namespace=~\"pg-.*\"}"
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving is failing on {{ $labels.pod }}"
            description: "The last failed WAL archive is newer than the last successful one. Point-in-time recovery is degrading and WAL is accumulating on the volume."
        - alert: CnpgBackupTooOld
          expr: "time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace=~\"pg-.*\"} > 172800"
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No recent backup for {{ $labels.pod }}"
            description: "The newest successful backup recorded by the barman-cloud plugin is older than 172800 seconds, or there is none."
        - alert: CnpgInstanceExporterDown
          expr: "cnpg_collector_up{namespace=~\"pg-.*\"} == 0"
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The metrics exporter on {{ $labels.pod }} cannot reach PostgreSQL"
            description: "cnpg_collector_up is 0: the instance's exporter is up but its database connection is not, so the cnpg_pg_* series the other rules read are missing or stale."
        - alert: CnpgInstanceScrapeDown
          expr: "up{container=\"postgres\",job=~\".+/.+\", namespace=~\"pg-.*\"} == 0"
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "The metrics of {{ $labels.pod }} are not being scraped"
            description: "The scrape target of a CloudNativePG instance has been down: its exporter is hung or unreachable (a network policy, a TLS mismatch), so the lag, archiving and HA rules cannot see the instance."
        - alert: CnpgBackupNotConfigured
          expr: "cnpg_collector_up{namespace=~\"pg-.*\", cnpg_cluster_backup_expected!=\"false\"} unless on (namespace, pod) barman_cloud_cloudnative_pg_io_last_available_backup_timestamp"
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No backup is configured for {{ $labels.pod }}"
            description: "The instance exports no barman-cloud backup metric, so CnpgBackupTooOld cannot see it: backups are not configured. Configure them, or, if this cluster is deliberately not backed up, opt out in the cnpg-cluster chart with backup.expected=false and a backup.notExpectedReason."
        - alert: CnpgManualSwitchoverRequired
          expr: "cnpg_collector_manual_switchover_required{namespace=~\"pg-.*\"} > 0"
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} waits for a manual switchover"
            description: "The cluster's primary needs a restart (an update, a changed parameter) and primaryUpdateStrategy is supervised: the operator waits for a person to switch over before it restarts the primary, and the rolling update stays half done until then."
            runbook_url: "https://github.com/truvity/cnpg/blob/master/docs/runbooks.md#cnpgmanualswitchoverrequired"
        - alert: CnpgInstanceFenced
          expr: "cnpg_collector_fencing_on{namespace=~\"pg-.*\"} > 0"
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is fenced"
            description: "The instance is fenced (the Cluster's cnpg.io/fencedInstances annotation names it, or \"*\"): PostgreSQL is stopped on it and it serves nothing. A fence is a deliberate, temporary step; lift it once the investigation that needed it is done."
            runbook_url: "https://github.com/truvity/cnpg/blob/master/docs/runbooks.md#cnpginstancefenced"
