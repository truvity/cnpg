# platform-posture spelled out by hand, the way a consumer wrote it before
# the posture existed: the same Cluster, trust objects and PodMonitor
# setting, with the runtime role's hba line in beforeCatchAll.
clusterName: shop-pg
namespace: shop
profile: prod
labels:
  example.com/project: shop
bootstrap:
  initdb: {database: shop, owner: shop}
postgresql:
  pgHba:
    beforeCatchAll:
      - hostssl all shop_app all scram-sha-256
peopleProject: shop
scheduling:
  databasePool: durable
  tolerations:
    - {key: arch, operator: Exists}
monitoring:
  podMonitor:
    enabled: false
replication:
  enabled: true
trust:
  namespace: cert-manager
  ca: {enabled: true}
  policy:
    enabled: true
    roles: [shop_app, shop]
  bundle:
    enabled: true
    extraCertificates:
      - |
        -----BEGIN CERTIFICATE-----
        MIIBexample
        -----END CERTIFICATE-----
serverTLS:
  existingSecret: shop-pg-server-tls
  existingCASecret: shop-pg-server-ca
