# The platform posture: scheduling, trust, replication and the PodMonitor
# default come from `posture: platform`; the runtime role is declared by
# another release (external), and the chart emits its scram hba line itself.
# The render equals the same values spelled out by hand
# (platform-posture-explicit) except for the hba line's source.
clusterName: shop-pg
namespace: shop
profile: prod
posture: platform
labels:
  example.com/project: shop
bootstrap:
  initdb: {database: shop, owner: shop}
roles:
  - {name: shop_app, auth: password, external: true}
peopleProject: shop
trust:
  bundle:
    extraCertificates:
      - |
        -----BEGIN CERTIFICATE-----
        MIIBexample
        -----END CERTIFICATE-----
serverTLS:
  existingSecret: shop-pg-server-tls
  existingCASecret: shop-pg-server-ca
