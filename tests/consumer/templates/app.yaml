apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        {{- include "cnpg-client.volumes" (dict "context" $ "client" .Values.client) | nindent 8 }}
      containers:
        - name: app
          image: example.invalid/app:1
          env:
            {{- include "cnpg-client.env" (dict "context" $ "client" .Values.client) | nindent 12 }}
          volumeMounts:
            {{- include "cnpg-client.volumeMounts" (dict "context" $ "client" .Values.client) | nindent 12 }}
{{- if .Values.networkPolicy }}
---
{{ include "cnpg-client.networkPolicy" (dict "context" $ "client" .Values.client) }}
{{- end }}
