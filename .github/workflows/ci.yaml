# CI now calls the shared workflow (truvity/ci-workflows), which fans the
# Justfile recipes out into PARALLEL jobs — one per recipe, each reporting
# under its own name. Before this they ran serially inside a single
# `just check` and a red result told you only that something failed.
#
# The recipe list mirrors this repo's own `check` recipe, so CI and a
# laptop still run the same thing; they just no longer run it the same way.
#
# Pinned by COMMIT SHA, never by tag or branch: tags move, and every
# repository in both organizations runs that code.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@02d66a9a2d64fe255d7703a1bebd764d0899f187 # v3.16.0
    with:
      # Required: the component contract (C1-C13) is judged, shown in the
      # job summary, and fails this job when a rule fails.
      policy-conformance: true
      policy-conformance-strict: true
      #
      # The clients-* recipes are the client adapters (clients/): the
      # TypeScript lint/types/unit/build, the Kotlin and Python build/unit
      # tests/release dry runs, and each language's conformance suite against a TLS
      # PostgreSQL started by the recipe itself (hosted runner, docker,
      # digest-pinned image, certificates generated per run). They are in
      # `just check` only as far as it stays free of docker: the conformance
      # recipes are CI-only. Each fails unless every case in
      # clients/conformance/cases.txt ran and passed.
      recipes: '["test","lint","chart-lint","leak-canary","rulecheck","clients-ts","clients-kotlin","clients-python","clients-go-conformance","clients-ts-conformance","clients-kotlin-conformance","clients-python-conformance"]'

  # A stable context name for branch protection. The matrix jobs report as
  # "recipes / build" and so on, so a required context naming them would
  # break the moment a recipe is added or renamed.
  check:
    needs: recipes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.recipes.result }}" = "success" ]'
