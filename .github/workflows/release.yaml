# Tag-triggered release — the shared implementation.
#
# The hand-rolled copy this replaces was one of many near-identical
# workflows across the public estate, and the shared one had sat in
# ci-workflows with ZERO callers. That is not a cosmetic gap: hand-rolled
# release workflows drift out of sync with the tool they invoke and
# nobody notices for weeks, because release machinery is exercised only
# by a tag. The first adopter of the shared workflow found a real bug in
# it within minutes (a permissions ceiling that dropped packages:write),
# fixed in ci-workflows v2.7.0.
#
# The caller grants the permissions because a reusable workflow can
# narrow them but never widen them. That same rule is why the private
# (ECR) half is a separate workflow rather than a flag on this one.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse
# than a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@b38472fac2bff567c7b138654cebc7da485170ca # v3.26.1
    with:
      # One job: goreleaser builds and archives cnpgctl and cuts the
      # GitHub release + changelog, then the charts (five) are pushed as
      # oci://ghcr.io/truvity/charts/<name> at the same tag.
      charts: '["cnpg-cluster","cnpg-database","cnpg-platform","cnpg-project-platform","cnpg-projects","cnpg-client"]'

  # The CRD mirror charts (barman-cloud-crds) are NOT in the `charts` list above: the
  # shared workflow stamps the tag onto every chart it is given, and these
  # carry the version of the upstream they mirror. Each is pushed only if
  # that version is not in the registry yet, never overwritten, so a release
  # that does not move an upstream pin publishes nothing here. Starts after
  # the release job, like the other follow-on jobs.
  crd-charts:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: truvity/ci-actions/setup-devbox@fbd89c3cb282ac906414235d5c6455cd83d254a8 # v1.12.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the CRD charts that are not yet published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRD_CHARTS: barman-cloud-crds
          # renovate: datasource=github-releases depName=truvity/ocictl
          HELMCTL_VERSION: "0.6.1"
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          mkdir -p "$RUNNER_TEMP/helmctl"
          gh release download "v${HELMCTL_VERSION}" --repo truvity/ocictl \
            --pattern "helmctl_${HELMCTL_VERSION}_linux_${arch}.tar.gz" \
            --output - | tar -xz -C "$RUNNER_TEMP/helmctl" helmctl
          # helmctl package shells out to helm, which lives in the devbox.
          HELMCTL="$RUNNER_TEMP/helmctl/helmctl" devbox run -- hack/release-crd-charts.sh

  # The TypeScript client (clients/ts, @truvity/cnpg-client) to GitHub
  # Packages, at the tag's version. Built and tested here, so the registry
  # holds exactly what passed. After the release job: a release whose
  # artifacts failed should not leave a package claiming its version. The
  # Go client needs nothing: the tag is the module version.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          registry-url: https://npm.pkg.github.com
          scope: "@truvity"
      - name: Build, test and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        working-directory: clients/ts
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          # The tag is the version; package.json carries 0.0.0.
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm publish

  # The Kotlin client (clients/kotlin, com.truvity.cnpg:cnpg-client) to GitHub
  # Packages (Maven), at the tag's version. Same shape as the npm job: after
  # the release job, built and unit-tested here, so the registry holds exactly
  # what passed. The conformance cases already ran in CI on the tagged commit.
  maven:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: clients/kotlin/pom.xml
          # Writes ~/.m2/settings.xml with this server id; the pom's
          # distributionManagement uses the same id.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build, test and publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        working-directory: clients/kotlin
        run: |
          set -euo pipefail
          # The tag is the version; pom.xml carries 0.0.0-SNAPSHOT.
          mvn -B -ntp versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false
          mvn -B -ntp verify
          mvn -B -ntp deploy -DskipTests

  # The Python client (clients/python, truvity-cnpg-client): the wheel and the
  # sdist, attached to the GitHub release of the tag. GitHub Packages has no
  # Python registry, and release assets of a public repository download
  # without a token. Public PyPI (trusted publishing) is a later decision.
  # After the release job, which creates the GitHub release.
  python:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - name: Build, test and attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        working-directory: clients/python
        run: |
          set -euo pipefail
          uv sync --locked
          uv run ruff check .
          uv run mypy src tests
          uv run pytest
          # The tag is the version; pyproject.toml carries 0.0.0.
          uv version --frozen "${TAG#v}"
          rm -rf dist
          uv build
          gh release upload "$TAG" dist/truvity_cnpg_client-*.whl dist/truvity_cnpg_client-*.tar.gz --clobber
